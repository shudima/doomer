[project]
name = "doomer"
version = "0.1.0"
description = "A personal, scrollable feed of source-backed text reels"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "sentry-sdk[fastapi]>=2.25,<3",
  "markdown-it-py>=3,<5",
  "pillow>=11,<14",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
