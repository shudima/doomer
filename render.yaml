services:
  - type: web
    name: doomer
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: DOOMER_ENVIRONMENT
        value: production
      - key: DOOMER_AUTH_MODE
        value: email
      - key: DOOMER_DATABASE_URL
        sync: false
      - key: DOOMER_OWNER_EMAIL
        sync: false
      - key: DOOMER_SENTRY_DSN
        sync: false
      - key: DOOMER_FRONTEND_SENTRY_DSN
        sync: false
