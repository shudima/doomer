title: From autocomplete to whole features
text: |-
  The presenter describes an inflection in their team’s experience. Earlier AI assistance helped complete functions and tests but often needed extensive correction. Newer coding agents could take on entire features.

  That can include exploring the codebase, writing and running tests, and moving changes toward integration. The reported speed gains are the team’s experience; the important shift is the scope of work they now delegate.
