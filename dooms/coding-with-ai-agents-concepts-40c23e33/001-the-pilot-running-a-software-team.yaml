title: The pilot running a software team
text: |-
  The presenter describes meeting a pilot who paused a conversation to approve a code change. In the background, agents were handling roles such as development, review and operations.

  The anecdote explains the presenter’s optimism: AI can bring more people into building software. The expected change is in what development looks like, with humans directing work that once required doing every implementation step themselves.
