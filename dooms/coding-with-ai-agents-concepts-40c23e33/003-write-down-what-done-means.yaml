title: Write down what done means
text: |-
  Instead of repeatedly arguing with a model through prompts, the video proposes specification-driven development. State the requirements and the outcomes the project should produce, then give that specification to the coding agent.

  The specification helps define both the artifacts to create and when the task is complete. Clear outcomes become part of the engineering work before the agent starts implementing them.
