title: Developers become conductors
text: |-
  When agents can implement tickets, the human’s architectural decisions become more prominent. The presenter compares this role to a conductor or captain: decide where the software should go and which choices will still matter a year later.

  Goals then become milestones an agent can work through. The shift changes engineering priorities toward directing and coordinating implementation while retaining responsibility for the larger design.
