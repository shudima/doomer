title: An estimate is not an execution
text: |-
  Ask a model how long a third-person role-playing game takes to build, and it might estimate weeks or months. Ask a coding agent to build one, and the presenter says it may produce a working example in five minutes.

  The contrast illustrates limits in how models discuss time and tasks. A quick working example and a complete game are different scopes; developers still need to understand what was actually delivered.
