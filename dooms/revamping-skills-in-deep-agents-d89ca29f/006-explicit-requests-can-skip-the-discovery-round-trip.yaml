title: Explicit requests can skip the discovery round trip
text: |-
  When a user names a skill, the application can pin it before the next model call. That avoids waiting for the model to read the description and decide to fetch the full instructions.

  Deep Agents does not parse the user’s syntax itself. The app must identify the requested skill from a command or interface selection and pass it through pinned_skills.
