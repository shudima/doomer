title: Skills disclose knowledge in stages
text: |-
  A skill is a directory whose SKILL.md contains a name, description, and instructions, optionally accompanied by scripts, references, and assets. Deep Agents first shows the short description, then loads the instructions and supporting material only when needed.

  The article divides this into discovery, activation, and execution. That structure lets a growing enterprise library advertise specialized capabilities without placing every procedure into every model call.
