title: Refresh deliberately because discovery affects caching
text: |-
  A changed skill catalog changes the system prompt and can invalidate the cache. The article notes that this cost may already be paid after an idle thread outlives the provider’s cache retention period.

  Applications can expose a reload command, update state directly, or trigger the reset in middleware. Refresh timing belongs to the app rather than being an invisible assumption about when the library changes.
