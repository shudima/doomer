title: One token after another adds time
text: |-
  An autoregressive language model generates tokens sequentially until its response is complete. Even if it imitates a structured decision format, that generation process still affects latency.

  Caleb contrasts this with Jev’s design for parallel sampling and typed probabilistic decisions. His point is about fitting architecture to the workload: automation can benefit from a decision interface without asking a general model to write every answer as text.
