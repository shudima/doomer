title: A different optimization target
text: |-
  Caleb presents TypeSafe’s argument that human-preference training and verifiable rewards do not automatically solve rapid decision-making under uncertainty. Jev targets that neglected part of automation.

  The claim is about different objectives and use cases, rather than one training path winning everywhere. A model optimized for chat or extended agent work may carry costs that become impractical when an application needs large numbers of quick judgments.
