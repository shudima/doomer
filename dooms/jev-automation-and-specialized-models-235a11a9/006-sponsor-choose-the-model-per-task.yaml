title: 'Sponsor: choose the model per task'
text: |-
  The Junie advertisement also describes bringing an API key and selecting models for individual tasks. Caleb presents those controls as ways to manage usage and choose a model suited to the job.

  The segment advertises a limited-time 75% discount for a named model. That is a promotional claim from the video’s publication period, not a verified price or an assurance that the offer remains available.
