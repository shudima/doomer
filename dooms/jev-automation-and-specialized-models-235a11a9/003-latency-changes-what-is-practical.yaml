title: Latency changes what is practical
text: |-
  Email sorting, retrieval improvement, games and model routing are tasks ordinary LLMs can perform. Caleb says the interesting difference is how quickly a specialized model can perform them.

  He relays Jev’s claimed 40–200-times speed advantage and 70–500-millisecond end-to-end responses. These are reported figures, not measurements reproduced in the video. The argument is that speed can make familiar capabilities practical at a different scale.
