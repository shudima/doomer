title: The interface asks for structure
text: |-
  Jev changes the interaction pattern a developer may expect from an LLM. The request specifies a structured decision, and the result is a structured probability distribution rather than a free-form answer.

  Caleb notes that this can initially feel unfamiliar. Software has to decide what to do with those probabilities and compose them into application behavior. The useful building blocks are different from a chat transcript.
