title: Inkling uses a continuous effort value
text: |-
  Inkling’s report describes specifying effort in the system message during large-scale reinforcement learning while adjusting the cost assigned to each generated token. Higher token costs encourage shorter traces; lower costs leave more room for reasoning.

  Its inference control is a continuous value between zero and one, rather than only low, medium, and high. The report does not reveal the exact reward formula, penalty coefficients, or whether effort conditioning also appeared in supervised fine-tuning.
