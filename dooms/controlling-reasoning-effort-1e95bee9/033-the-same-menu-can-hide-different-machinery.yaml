title: The same menu can hide different machinery
text: |-
  Across the open-weight examples, several ingredients recur: supervised examples and templates teach selectable modes, effort-conditioned rewards change the incentive to spend tokens, and budget-aware methods prepare the model for shorter reasoning.

  Some systems distill specialists; others mix response styles or train one policy under alternating constraints. A shared label such as “high effort” does not imply a shared training recipe, an identical token allowance, or the same expected accuracy across products.
