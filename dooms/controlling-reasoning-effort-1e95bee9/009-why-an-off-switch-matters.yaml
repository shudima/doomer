title: Why an off switch matters
text: |-
  Early dedicated reasoning models tended to produce long traces even for simple prompts. DeepSeek-R1 did not have a built-in toggle for direct, non-reasoning answers.

  Hybrid models such as Qwen3 put both behaviors in one checkpoint: an extended reasoning response when useful, or a direct answer when requested. “Thinking mode” and “reasoning mode” refer to the same distinction here. The benefit is control over unnecessary work without selecting an entirely different model.
