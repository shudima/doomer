title: Think tags mark a boundary
text: |-
  The strings `<think>` and `</think>` separate a reasoning trace from the final answer. They let training pipelines and interfaces identify, display, or hide the two parts.

  The tags themselves do not give a model reasoning ability. Other delimiters could serve the same purpose, and Raschka argues that a model could be trained without them. The useful distinction is between learning a problem-solving behavior and labeling where that behavior appears in the generated response.
