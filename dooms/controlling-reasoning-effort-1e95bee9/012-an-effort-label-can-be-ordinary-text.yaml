title: An effort label can be ordinary text
text: |-
  OpenAI’s open-weight gpt-oss models place a low, medium, or high reasoning-effort instruction in the system message. The same model receives the chosen label and adjusts its response behavior.

  Raschka suggests that proprietary GPT models may use a similar approach, but their implementation is not public. The documented gpt-oss mechanism is evidence that prompt-based control is possible; it does not establish exactly how a particular proprietary model or interface implements its menu.
