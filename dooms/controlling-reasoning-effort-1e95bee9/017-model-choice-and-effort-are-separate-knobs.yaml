title: Model choice and effort are separate knobs
text: |-
  Selecting a different model changes the trained checkpoint. Increasing effort keeps the checkpoint fixed and changes inference-time work. Choosing a model in an interface does not perform new training; it selects among models already trained at different scales.

  The article shows that a smaller model at higher effort can sometimes approach a larger model at lower effort. The overlap is benchmark-specific, so it invites measurement rather than a universal rule about which combination is cheaper or better.
