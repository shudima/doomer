title: Nine specialists, one Kimi model
text: |-
  Kimi K3 develops three effort specialists in each of three domains: general tasks, general agents, and coding agents. That produces nine specialists with different domain and effort combinations.

  Multi-teacher on-policy distillation combines their behavior into a single model. At inference, a natural-language effort instruction selects the desired behavior. This later technical-report update supplies training details that the article’s earlier discussion of the initial K3 announcement could only leave open.
