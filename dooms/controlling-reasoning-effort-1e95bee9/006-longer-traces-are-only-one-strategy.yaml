title: Longer traces are only one strategy
text: |-
  Reasoning traces already increase inference work because the model generates additional tokens before its answer. Effort settings can adjust that work, but inference scaling includes other methods too.

  Self-consistency samples multiple solutions and selects an answer by agreement, often through majority voting. Self-refinement revisits an attempted solution. These techniques can complement reasoning-model training; the article points to DeepSeekMath-V2 as an example of extensive inference scaling on a specialized math model.
