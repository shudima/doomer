title: Formatting is a separate reward
text: |-
  A model can receive a correctness reward and a formatting reward at the same time. In the article’s DeepSeek-R1 example, the total reward combines answer accuracy with a rule encouraging reasoning inside the expected tags.

  This teaches a recognizable response structure. It does not make the tags a substitute for the underlying reasoning training. A correctly formatted reasoning block can still contain mistakes, just as a well-formatted final answer can still be wrong.
