title: Two ways to spend more compute
text: |-
  Reasoning performance can improve through training or through additional computation after training. These are different places to spend resources.

  Training changes the model’s parameters and the behavior it learns. Inference scaling spends more computation while using a trained model, for example by generating a longer reasoning trace or trying multiple solutions. An effort setting is one way to control the latter, but the model generally needs training that makes the setting meaningful.
