title: There is no controlled winner yet
text: |-
  The article does not rank one effort-training recipe as universally best. The models differ in base checkpoints, data, post-training compute, evaluation suites, and serving goals, while their reports omit details needed for a controlled comparison.

  A setting that suits an interactive assistant may also be a poor choice for a long-running coding agent. Compare the actual accuracy, cost, and latency of the complete system you plan to use, rather than inferring quality from the effort mechanism alone.
