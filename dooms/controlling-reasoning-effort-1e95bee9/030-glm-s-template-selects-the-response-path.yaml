title: GLM’s template selects the response path
text: |-
  In the open GLM-5 chat template, thinking mode begins the assistant response with an opening reasoning tag. Disabling it supplies a prefix that closes reasoning immediately, directing generation toward the final answer.

  After supervised training, GLM-5 passes through reasoning, agentic, and general reinforcement learning. A final on-policy distillation stage draws on earlier checkpoints to recover capabilities that may have weakened during sequential training. The hosted implementation is not fully disclosed.
