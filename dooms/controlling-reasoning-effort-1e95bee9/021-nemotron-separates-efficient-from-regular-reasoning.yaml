title: Nemotron separates efficient from regular reasoning
text: |-
  Nemotron 3 Ultra offers reasoning-off, regular, and medium-effort modes. Here, medium-effort is cheaper than regular reasoning; the names do not imply a universal ordering shared across model families.

  Its medium-effort behavior begins with supervised examples generated by GPT-OSS-120B in medium-effort mode. Reinforcement learning further calibrates it using length-based reward adjustments. About 2.5% of RLVR prompts use the medium-effort setting across math, STEM, and coding tasks.
