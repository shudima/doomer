title: A fixed budget can teach the wrong habit
text: |-
  Training a reasoning model under a consistently tight budget can make it concise while weakening its ability to benefit from additional inference work. Shorter output is useful only if the model retains enough capability to solve the task.

  Kimi K2.5’s Toggle method addresses this by alternating reinforcement-learning phases. One encourages correct solutions within a problem-specific budget. The other restores the normal maximum generation length so longer solutions remain part of learning.
