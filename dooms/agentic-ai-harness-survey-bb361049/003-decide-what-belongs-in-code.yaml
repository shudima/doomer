title: Decide what belongs in code
text: |-
  Ask four questions about each responsibility. Can the correct behaviour be fully specified? Could a mistake be costly or irreversible? Does the decision require interpreting messy language? Must the rule hold even when the model is manipulated?

  Use code for exact invariants, the model for interpretation, and code or human gates around consequential execution. Record this split for every capability so safety rules do not quietly become optional prompt instructions.
