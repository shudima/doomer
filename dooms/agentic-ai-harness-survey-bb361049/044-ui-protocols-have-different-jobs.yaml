title: UI protocols have different jobs
text: |-
  A2UI describes declarative interfaces rendered with approved native widgets. AG-UI transports backend-to-frontend events, including text, tools, state and interrupts; it can carry a UI format without defining components.

  MCP Apps delivers tool-provided interactive HTML in a sandboxed host frame. The survey distinguishes these integration roles. Choose the layer the experience needs while retaining evidence, accessibility and reviewable actions.
