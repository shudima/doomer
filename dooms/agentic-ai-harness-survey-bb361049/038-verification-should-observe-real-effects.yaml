title: Verification should observe real effects
text: |-
  Runtime verification checks work before acceptance. It differs from offline evaluation, which measures behaviour across test cases.

  Use deterministic checks for schemas, IDs, calculations, citations and tests. Read a record back after writing it, or inspect a rendered interface after changing it. The harness should run checks and retain their results, rather than accepting the agent's statement that it verified the work. A test that actually ran provides evidence a confident completion message cannot.
