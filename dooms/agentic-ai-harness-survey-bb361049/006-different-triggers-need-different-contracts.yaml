title: Different triggers need different contracts
text: |-
  A chat message, a button press and a scheduled event should not enter an agent as indistinguishable strings. Define a versioned input shape for each trigger.

  A structured command can invoke a known workflow directly. An unattended event needs narrower permissions because nobody is present to clarify. Images, audio and PDFs may need deterministic preprocessing. Requests from other agents also need provenance and the originating user's identity rather than assumed authority.
