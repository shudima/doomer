title: Load expertise in stages
text: |-
  A skill packages procedural knowledge with optional scripts and references. It lets one general agent acquire specialised instructions only when needed.

  Loading has three stages: short names and descriptions at startup, the full SKILL.md when a task matches, and supporting files when the procedure calls for them. This keeps specialised knowledge out of every model call. Exact computations and transformations belong in the skill's scripts, where they can be executed and checked.
