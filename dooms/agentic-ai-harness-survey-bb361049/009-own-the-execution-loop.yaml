title: Own the execution loop
text: |-
  An agent repeatedly assembles context, calls the model, executes requested tools and observes results. The harness owns the control points around that cycle.

  Validate tool arguments and referenced objects, apply permissions and approval policy, then execute. Run independent calls in parallel. Append compact results and errors, save state, and check budgets. A response without tool calls is a candidate final answer; verification still needs to decide whether it is ready for the user.
