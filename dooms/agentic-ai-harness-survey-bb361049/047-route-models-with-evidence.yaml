title: Route models with evidence
text: |-
  Hard planning and judgement may benefit from a stronger model, while classification, extraction or bounded reading may work with a faster one. Reasoning effort can also vary by step.

  These are hypotheses to evaluate, not automatic savings. Compare models using the same tasks, tools and reliability requirements. Set task-level budgets and watch 95th-percentile latency as well as cost. Revisit model choices when alternatives change, using the existing suite so comparisons remain meaningful.
