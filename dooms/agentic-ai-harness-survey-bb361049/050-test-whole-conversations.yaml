title: Test whole conversations
text: |-
  User simulators can supply a persona, goal and hidden information during multi-turn tests. Grade final state and information conveyed, rather than only one answer.

  The survey notes that tau-squared-bench's shared-control setting, where users also act, made tasks harder. Simulators can make errors too. Validate them and include vague, mistaken, changing and adversarial users, rather than only cooperative scripts.
