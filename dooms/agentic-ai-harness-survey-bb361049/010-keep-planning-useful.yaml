title: Keep planning useful
text: |-
  Long tasks benefit from a visible plan that changes when observations contradict it. A checklist or brief restatement near the end of context can keep the goal in view.

  Measure the overhead. The survey describes Manus moving planning out of its main agent after list maintenance consumed too much activity. A plan should guide execution without becoming most of the work.
