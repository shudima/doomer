title: Calibrate the graders
text: |-
  Code graders suit exact state, values, schemas and action constraints. Model judges assess qualitative properties using clear criteria and evidence.

  Use narrow, observable rubrics, preferably one dimension per judge, and calibrate against human labels. A different model family may reduce shared blind spots. Human review remains necessary for calibration and subjective cases. A score deserves confidence only when its grading process does.
