title: Assess visibility before quality
text: |-
  The survey's assessment method begins by obtaining real traces and full contexts. Without them, the first finding is that the system cannot be assessed reliably.

  Next, map the harness: triggers, configuration, loop, agents, tools, skills, context, memory, data, identity, controls, verification, approvals and interface. Record which responsibilities are enforced in code and which rely on model judgement. This map establishes the boundaries that later transcript review and probes need to test.
