title: Levels of database freedom
text: |-
  Structured data can be accessed through reviewed parameterised tools, governed metrics or free-form SQL. More freedom brings more control problems.

  Use fixed tools for common questions and a semantic layer for flexible analytics with shared definitions. Reserve free-form SQL for expert exploration under strong limits. Writes should use business-operation tools with checks, rather than arbitrary model-generated SQL changes.
