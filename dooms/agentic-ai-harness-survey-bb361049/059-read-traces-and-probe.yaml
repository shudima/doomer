title: Read traces and probe
text: |-
  Read at least thirty real runs, including common requests, long sessions and complaints. Look for wasted steps, tool confusion, unsupported claims and silent failures.

  Repeat probes for permission boundaries, injected content, crash recovery, early constraints, missing answers, known analytical results and correct refusal. Then audit datasets, judge calibration, repeated evaluations, coverage of past incidents and release gates.
