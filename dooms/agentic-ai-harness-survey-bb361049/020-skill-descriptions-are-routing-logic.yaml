title: Skill descriptions are routing logic
text: |-
  A skill can be useful yet never load because its description is vague. An overly broad description can trigger it on unrelated work.

  Test both sides: relevant tasks should activate the skill, and similar-looking irrelevant tasks should not. Keep instructions concise and detailed references separate. Review external skills like third-party code, because a folder of procedural guidance may also contain executable scripts. Installing expertise also adds a supply-chain dependency.
