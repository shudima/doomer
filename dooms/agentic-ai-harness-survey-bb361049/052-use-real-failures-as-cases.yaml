title: Use real failures as cases
text: |-
  Start with a few dozen cases from requests, complaints, bugs and traces. Give each explicit success criteria reviewed by a domain expert.

  Include action, refusal, clarification and missing-data scenarios so tests do not reward overconfidence. Public benchmarks inform general comparisons and evaluation design, but cannot replace your tasks and policies. Move reliably solved hard cases into the regression suite.
