title: Evaluate outcomes and paths
text: |-
  An evaluation combines a task, defined environment, recorded run and graders. Capability suites explore hard tasks; regression suites protect solved behaviour.

  Test components, single turns, conversations, trajectories, final world state and security. Prefer outcome grading when different valid paths can succeed. Retain trajectory checks for approvals, required policy steps, repetition and resource use: these matter regardless of the final answer.
