title: Resume without repeating side effects
text: |-
  A long-running agent must survive crashes, deployments and hours of waiting for approval. Persist progress after each step so the run can resume from a checkpoint.

  Retries create a second requirement: side effects must be idempotent. A message tool can use a key derived from the run and step to avoid sending twice. Test recovery by interrupting a multi-step task and checking both that progress resumes and that earlier actions are not duplicated.
