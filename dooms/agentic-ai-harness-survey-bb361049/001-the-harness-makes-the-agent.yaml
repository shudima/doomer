title: The harness makes the agent
text: |-
  A model can choose actions, but the surrounding software makes those choices useful. The harness supplies tools, context, state, permissions, budgets, verification and presentation.

  The survey's central claim is that this environment determines much of an agent's practical quality, cost and safety. A stronger model cannot compensate for missing information, unusable tools or absent feedback. Treat the harness as a product that can be inspected and improved.
