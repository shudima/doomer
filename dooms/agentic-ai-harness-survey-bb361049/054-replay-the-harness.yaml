title: Replay the harness
text: |-
  Test tools, policies, parsers, state and context assembly with ordinary deterministic tests. A context-builder test can assert exactly what the model would receive.

  Recorded model responses exercise tool requests, errors, interrupts and stop conditions without live calls. This makes the loop reproducible and cheap to check, isolating software defects before the more expensive task of measuring variable model behaviour.
