title: Give the assistant a feedback loop
text: |-
  An assistant needs a practical way to inspect whether its work succeeded. For code, that may mean running it and reading errors. For an evaluation pipeline, it means inspecting metrics and transcripts. For a dashboard, it includes checking the rendered result.

  Yan's principle is to expose the evidence required for correction, so the assistant can iterate rather than simply declare completion.
