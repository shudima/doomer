title: Work should improve the next session
text: |-
  Eugene Yan wants AI-assisted work to accumulate value. Finished code, analyses and decisions become useful context for later work. Corrections should also improve the instructions that guide future sessions.

  His underlying principles resemble onboarding a colleague: supply context, explain preferences, make checking easy, delegate meaningful work and feed the lessons back into the system.
