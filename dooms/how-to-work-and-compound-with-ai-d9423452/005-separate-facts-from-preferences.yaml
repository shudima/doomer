title: Separate facts from preferences
text: |-
  Yan distinguishes two kinds of persistent memory. Project status, completed artifacts and domain facts belong in the knowledge vault. Behavioral preferences, procedures and personal taste belong in the assistant's configuration.

  Both need durable storage. Keeping the distinction clear makes it easier to update a changing project fact without accidentally turning it into a permanent rule for every future task.
