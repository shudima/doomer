title: Let corrections improve the system
text: |-
  Repeated requests such as reminders to check something can reveal missing instructions or broken verification steps. Yan mines past conversations for these patterns and uses the original examples to guide updates.

  Configuration also needs pruning: overlapping rules may conflict, and each preference should generally have a clear home. The lasting goal is a collaborator that improves through accumulated context and feedback.
