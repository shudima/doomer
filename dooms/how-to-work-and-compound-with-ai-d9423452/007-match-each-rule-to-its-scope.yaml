title: Match each rule to its scope
text: |-
  Some preferences apply everywhere, while repository conventions and project terminology have narrower audiences. Yan places each kind of guidance near the level where it matters.

  This avoids making every session carry every project's details. Directory-scoped instructions provide a way to combine general behavior with local requirements, while keeping the boundaries understandable to the person maintaining them.
