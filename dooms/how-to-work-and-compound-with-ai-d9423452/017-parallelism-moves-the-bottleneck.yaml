title: Parallelism moves the bottleneck
text: |-
  Running several sessions can shift human effort toward writing clear specifications and reviewing results quickly enough. Yan reports that coordinating work becomes more limiting than supplying every implementation step.

  Parallel sessions also need separation. Independent repository checkouts help prevent competing edits, while useful status indicators make it easier to identify which session is working, finished or waiting for attention.
