title: Decline feedback you cannot support
text: |-
  Seniority can bring requests to assess people after only a brief interaction. Yan considers it acceptable to decline when the evidence is too thin.

  A confident opinion is not automatically a useful one. Promotion or performance feedback should reflect a meaningful sample of someone's work and behavior, rather than the authority of the person asked to provide it.
