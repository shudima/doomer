title: Alignment is part of technical work
text: |-
  Large technical projects span teams and reporting lines. A correct proposal still needs people who understand it, care about it and can help carry it into practice.

  Yan recommends building momentum and finding sponsorship rather than waiting for agreement to appear automatically. A prototype that demonstrates value can sometimes achieve more than another round of abstract persuasion.
