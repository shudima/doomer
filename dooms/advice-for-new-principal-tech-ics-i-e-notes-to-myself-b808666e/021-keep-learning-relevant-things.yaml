title: Keep learning relevant things
text: |-
  Technical leadership does not suspend the need to learn. Yan warns that projects offering no relevant growth can leave a person falling behind as the industry changes.

  Some such work is unavoidable, but it can be timeboxed. Learning can also come through papers, technical books and small prototypes outside immediate delivery demands, rather than only through the next assigned project.
