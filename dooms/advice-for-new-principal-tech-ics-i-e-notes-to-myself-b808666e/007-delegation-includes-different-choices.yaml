title: Delegation includes different choices
text: |-
  Once someone owns a project, they must be allowed to choose a reasonable approach you would not have chosen. Guidance should not quietly turn ownership back into approval-seeking.

  Yan makes an important exception for dangerous, difficult-to-reverse decisions. Supporting autonomy and intervening at a high-risk boundary require judgment; neither permanent control nor total disengagement is an adequate default.
