title: Change the unit of impact
text: |-
  The code that earned a promotion may no longer be the most consequential part of the role. A principal's contribution also includes technical direction, design feedback, organizational context and identifying problems worth solving.

  Yan does not argue for abandoning hands-on work. He argues for judging impact through how effectively the wider organization builds, including work that crosses traditional role boundaries.
