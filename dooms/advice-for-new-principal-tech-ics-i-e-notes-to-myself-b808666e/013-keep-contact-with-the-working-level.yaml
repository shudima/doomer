title: Keep contact with the working level
text: |-
  Design reviews, demos and ordinary conversations help a principal stay connected to what teams actually face. Broad strategic context is useful only when it remains informed by operational detail.

  Yan pairs longer-term perspective with pragmatism. Help teams see beyond immediate delivery, but listen to the people doing the work and accept local solutions when they make sense.
