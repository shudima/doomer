title: Distinguish owner, sponsor and consultant
text: |-
  A principal's charter can mix three responsibilities. A consultant provides informed reviews and guidance. A sponsor also builds priority, alignment and decisions around an idea.

  An owner adds deep responsibility for design, execution and outcomes. Yan uses these categories to align expectations with leadership and avoid treating every project as if it requires the same intensity of involvement.
