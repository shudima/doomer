title: Explain the reasoning behind the judgment
text: |-
  Giving a recommendation without its rationale encourages people to repeat an authority's conclusion instead of learning how to decide. Yan emphasizes sharing the mental model behind a judgment.

  This is especially important under uncertainty: explain which evidence matters, which gaps remain and why you weigh them that way. The reasoning can help others handle the next decision independently.
