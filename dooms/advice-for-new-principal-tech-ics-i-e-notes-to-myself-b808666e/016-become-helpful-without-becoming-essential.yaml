title: Become helpful without becoming essential
text: |-
  Getting to principal often involves taking responsibility on the critical path. Continuing to grow requires helping the organization operate effectively without depending on your constant availability.

  Yan describes a transition toward being adjacent to the work. Build capability and ownership elsewhere, and be careful about taking a critical-path role when broader responsibilities may repeatedly pull your attention away.
