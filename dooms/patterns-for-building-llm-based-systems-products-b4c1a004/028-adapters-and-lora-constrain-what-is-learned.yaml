title: Adapters and LoRA constrain what is learned
text: |-
  Adapters add trainable components around a largely frozen pretrained model. LoRA represents weight updates through low-rank matrices, reducing the number of parameters that must change.

  Yan explains the motivation in terms of a lower-dimensional adaptation problem. The reviewed findings suggest efficient customization can be competitive with full fine-tuning, but the comparison remains dependent on the task, data and chosen configuration.
