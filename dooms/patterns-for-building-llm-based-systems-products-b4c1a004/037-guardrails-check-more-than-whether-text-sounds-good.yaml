title: Guardrails check more than whether text sounds good
text: |-
  A production response may need valid structure, acceptable values, factual support and appropriate content. Inputs can also require checks before reaching the model.

  Yan treats guardrails as a collection of controls around these requirements. Different checks solve different problems; a response that passes a JSON parser is not thereby faithful to its source, just as a well-grounded answer may still have an unusable format.
