title: Training examples need both quality and usable rights
text: |-
  Yan lists expert labels, user feedback, suitably licensed model-generated examples and existing datasets as possible starting points for adaptation. Each option has a different cost and quality profile.

  He also notes that provider terms can restrict using generated outputs to develop other models. The article's quoted license language is historical; it is not a current statement of any provider's terms.
