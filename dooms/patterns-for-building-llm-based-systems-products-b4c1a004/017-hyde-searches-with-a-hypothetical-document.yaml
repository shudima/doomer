title: HyDE searches with a hypothetical document
text: |-
  HyDE first generates a hypothetical answer-like document, embeds it and uses that vector to retrieve real documents. It offers a route when labeled query-passage relevance pairs are unavailable.

  The generated document is a retrieval aid, not verified evidence. The method's intuition is that a compressed representation can retain useful relevance signals while the actual corpus supplies the material used downstream.
