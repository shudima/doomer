title: Work backward from the human experience
text: |-
  Yan contrasts Google's development-oriented patterns with Apple's emphasis on familiar interface principles. Both ask builders to consider where automation helps and how people will understand its role.

  Apple's examples distinguish essential from complementary ML, proactive from reactive assistance and changing from static behavior. These distinctions help determine the appropriate controls and expectations rather than assuming every AI feature deserves the same interface.
