title: Measure whether requests actually repeat
text: |-
  A cache helps when many requests can reuse a relatively small set of results. If requests are effectively uniform and constantly different, maintaining cached material may cost more than it saves.

  Yan recommends inspecting request patterns and cache hit rates. The decision should follow the workload rather than the attractiveness of avoiding an expensive model call in a diagram.
