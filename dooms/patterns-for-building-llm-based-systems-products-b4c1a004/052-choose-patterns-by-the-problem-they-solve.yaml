title: Choose patterns by the problem they solve
text: |-
  The article's seven patterns form a connected toolkit, not a requirement to implement every technique in every product. Some improve performance, others reduce cost or risk, and their effects span data infrastructure through user experience.

  Yan closes by treating production language-model design as an evolving discipline. A useful system needs measured trade-offs and real user learning, not merely a convincing first demonstration.
