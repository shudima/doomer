title: Specialization can improve control and reduce dependency
text: |-
  Fine-tuning can adapt model behavior to a particular task and support smaller specialized components. Hosting those components can also change the system's data-handling, throughput and external-service dependencies.

  Yan presents these as reasons to consider customization, not proof that every team should train its own model. The benefits have to justify the associated data collection, evaluation and operating work.
