title: Behavior needs interpretation, not blind counting
text: |-
  Accepting, modifying or ignoring a code suggestion can signal different levels of usefulness. Conversation length is more ambiguous: it might reflect an engaging exchange or a user struggling to obtain the needed answer.

  Yan cautions that implicit signals need context. Collecting more events is not enough if the team cannot explain how those events relate to user success.
