title: Retrieval supplies knowledge outside the weights
text: |-
  Retrieval-augmented generation supplies relevant external information as context for an answer. Yan emphasizes easier updates and removals compared with repeatedly changing model weights.

  The pattern can improve grounding and provide newer information, but it depends on finding useful evidence. It brings an information-retrieval problem into the system rather than making knowledge quality disappear as an engineering concern.
