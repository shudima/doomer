title: Keep room for direct human inspection
text: |-
  A numerical metric may miss the qualities that matter in a real example. Yan includes practitioner experience of watching answers to a small set of meaningful prompts change during model development.

  Human inspection complements repeatable measurements. It can expose failures the existing metrics do not represent and suggest the next examples or criteria to add to the evaluation set.
