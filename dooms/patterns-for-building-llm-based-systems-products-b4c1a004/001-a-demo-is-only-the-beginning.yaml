title: A demo is only the beginning
text: |-
  Eugene Yan organizes production language-model systems around seven patterns: evaluation, retrieval, fine-tuning, caching, guardrails, defensive user experience and feedback collection.

  They address different parts of the journey from data to users, balancing capability against cost and risk. The article draws on research and practitioner examples; its named models and tools reflect the period in which it was written, rather than a current product ranking.
