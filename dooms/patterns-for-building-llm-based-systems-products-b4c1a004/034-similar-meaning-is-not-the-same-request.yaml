title: Similar meaning is not the same request
text: |-
  A semantic cache may treat summaries of two different films in the same series as similar enough to reuse. That can deliver a fluent but incorrect answer about the wrong item.

  Yan compares this with serving stale prices during checkout. Cache design must preserve the distinctions and freshness the user depends on; vector similarity alone is not a sufficient correctness condition.
