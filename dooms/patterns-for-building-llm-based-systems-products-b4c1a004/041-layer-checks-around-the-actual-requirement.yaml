title: Layer checks around the actual requirement
text: |-
  Yan groups practical controls into structural guidance, syntax checks, content moderation, semantic or factuality checks and input restrictions. A categorical value can be checked against an allowed set, while a summary needs a different test of support.

  The useful combination follows the product's failure modes. Applying every available check without that connection can add complexity without establishing the property that actually matters.
