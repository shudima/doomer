title: Approximate search exchanges exactness for speed
text: |-
  Large vector collections often use approximate nearest-neighbor search instead of comparing every item exactly. Yan discusses hashing, quantized indexes and navigable graphs as different ways to reduce search work.

  His examples include LSH, FAISS, HNSW and ScaNN. Their implementations differ, but they share the goal of recovering sufficiently relevant neighbors within practical latency and memory budgets.
