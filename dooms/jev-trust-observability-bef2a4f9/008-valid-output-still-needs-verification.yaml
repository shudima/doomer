title: Valid output still needs verification
text: |-
  You can check that a decision has the expected type. You can record its probability, log the inputs, and audit the workflow around it. Those are useful checks, but they do not independently prove the intelligence behind the prediction.

  The presenter’s security stance is to verify before trusting. Receiving a valid, well-formed answer is a different achievement from establishing that its conclusion is justified.
