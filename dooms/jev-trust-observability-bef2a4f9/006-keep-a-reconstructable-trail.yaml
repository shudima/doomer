title: Keep a reconstructable trail
text: |-
  When a system behaves badly, investigators need to reconstruct what entered it, what changed, which rules or data were consulted, and what action followed. That is the role of an audit trail.

  For an AI-assisted security response, the same need remains. Accountability depends on records someone can investigate and verify, especially when the recommended action could shut down a working system.
