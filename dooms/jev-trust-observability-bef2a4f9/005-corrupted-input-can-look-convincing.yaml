title: Corrupted input can look convincing
text: |-
  An attacker might alter a log, manipulate metadata, poison a data source, or exploit the workflow that feeds the model. The resulting decision could be internally consistent with the corrupted information.

  A high confidence score would not expose that manipulation by itself. The model and its inputs are part of the attack surface, and ordinary mistakes can produce wrong answers without an attacker at all.
