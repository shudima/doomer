title: A probability is not a trust policy
text: |-
  A fortune-telling ball can sound certain without giving a useful reason. The video opens with that joke to raise a serious question about Jev: how do we trust a model that returns quick decisions and probabilities?

  Its appeal is clear for automation. Its challenge is also clear: a structured answer can leave the person responsible for an action unable to see why it was chosen.
