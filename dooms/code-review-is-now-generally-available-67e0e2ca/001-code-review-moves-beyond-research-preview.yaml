title: Code Review moves beyond research preview
text: |-
  Anthropic’s October 15, 2026 announcement makes Code Review generally available to Claude Team and Enterprise organizations. It targets the review bottleneck as coding agents increase code output.

  Preview customers wanted faster, quieter reviews matched to each repository. The release responds with shorter review times, more focused findings, and configurable depth. These are the company’s reported product improvements, rather than independent evaluation results.
