title: Choose review depth, then enable repositories
text: |-
  Admins can select Quick, Standard, or Deep review for each repository, with Standard as the default. The intent is to match the review’s depth to the codebase.

  To start, an administrator enables Code Review in Claude Code settings, installs the GitHub App, and selects repositories. Developers then receive automatic reviews on new pull requests without adding their own configuration, according to the announcement.
