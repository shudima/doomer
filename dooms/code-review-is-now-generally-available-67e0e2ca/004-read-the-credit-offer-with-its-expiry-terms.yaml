title: Read the credit offer with its expiry terms
text: |-
  The announcement says eligible Claude Enterprise organizations can claim at least $10,000 in Code Review credits by January 15, 2027. Credits expire thirty days after they are claimed, and additional terms apply.

  This is an eligibility-limited offer, not a benefit promised to every Team or Enterprise account. The claim deadline and the post-claim expiry are different constraints, so both matter when deciding when to use it.
