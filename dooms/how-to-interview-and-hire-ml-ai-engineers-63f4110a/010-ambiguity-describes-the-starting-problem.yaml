title: Ambiguity describes the starting problem
text: |-
  Yan's AICE framework begins with ambiguity: how much of the problem, success criteria and possible solution were already defined when the candidate arrived?

  Ask whether the person established direction or mainly implemented a clear plan, and how much guidance they received. This distinguishes solving an unfamiliar, cross-functional problem from performing well within a narrower and more settled assignment.
