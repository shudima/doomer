title: Influence needs evidence of personal contribution
text: |-
  Influence can range from improving one team's work to shaping decisions across organizations or a field. Yan recommends asking how it actually happened: reviews, mentoring, roadmaps or stakeholder discussions.

  A cross-functional project alone does not establish the candidate's influence. Clarify which relationships and decisions they handled themselves rather than attributing their manager's negotiations or the broader team's work to them.
