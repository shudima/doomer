title: Align interviewers before collecting evidence
text: |-
  A pre-brief establishes the actual work, level and responsibilities being assessed. Interviewers need to know whether the role centers on analysis, recommendation systems, language-model applications or something else.

  Yan also recommends aligning on expected ambiguity, influence, complexity and execution. Without that context, several competent interviewers can gather incompatible evidence because each is silently evaluating a different imagined job.
