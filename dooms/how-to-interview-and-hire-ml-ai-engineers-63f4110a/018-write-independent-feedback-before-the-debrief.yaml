title: Write independent feedback before the debrief
text: |-
  Yan recommends recording evidence and an initial recommendation independently after each interview. This reduces the chance that an early opinion in the group replaces the interviewer's own observations.

  The debrief can then compare written evidence, examine contradictions and revise judgments. It should end in a decision owned by the hiring manager, with strong concerns investigated rather than hidden beneath an apparent consensus.
