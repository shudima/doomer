title: Build relationships before a vacancy becomes urgent
text: |-
  Senior hiring can take a long time, and strong potential candidates may already be absorbed in work they enjoy. Yan recommends developing relationships through professional communities rather than expecting every good match to be actively applying.

  His timing estimates are experience-based, not guarantees. The broader lesson is to plan for sustained relationship-building instead of treating hiring as a last-minute transaction.
