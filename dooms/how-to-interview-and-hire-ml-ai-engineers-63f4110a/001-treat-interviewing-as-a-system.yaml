title: Treat interviewing as a system
text: |-
  Eugene Yan and Jason describe interviewing as a process that should reliably gather evidence about fit for a particular team and role. Hiring quality depends partly on reducing noise in that process.

  Their recommendations cover technical ability, broader operating skills, screening, interview loops and the candidate experience. They present professional judgments from experience, rather than a universally validated formula for selecting people.
