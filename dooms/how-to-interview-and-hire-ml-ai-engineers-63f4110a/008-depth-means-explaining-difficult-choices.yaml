title: Depth means explaining difficult choices
text: |-
  A depth interview lets a candidate examine a project they know well. Useful questions cover alternatives, evaluation, error analysis, constraints, safeguards, outcomes and what they would change afterward.

  These fundamentals remain informative even when the candidate's domain differs from the interviewer's. The aim is evidence of rigorous thinking and implementation knowledge, not shared familiarity with a narrow technical topic.
