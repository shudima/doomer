title: Complex problems can deserve simple solutions
text: |-
  Yan distinguishes the complexity of a problem from the complexity of the proposed solution. Interdependent systems and competing constraints may require deep judgment without requiring an elaborate architecture.

  The interview should reveal what made the problem difficult and how effectively the candidate simplified it. Otherwise, technical intricacy can be mistaken for impact instead of examined as a possible cost.
