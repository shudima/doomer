title: Explain the opportunity without overselling it
text: |-
  Candidates may care about the mission, talented colleagues and a manager who supports growth as well as compensation. Yan recommends explaining the real opportunity in those terms.

  The role's unglamorous work should also be explicit. Attracting someone through inaccurate expectations can produce disappointment and an early departure, whereas an honest mismatch discovered before hiring saves both sides considerable cost.
