title: Calibrate the screen before an expensive loop
text: |-
  A full interview loop consumes substantial candidate and interviewer time. Yan recommends a screen selective enough that the hiring manager already sees a credible case for hiring before proceeding.

  This is a calibration principle, not a reason to ignore an unhealthy pipeline. Screening should be reviewed when too few candidates advance, rather than using the full loop merely to resolve every initial uncertainty.
