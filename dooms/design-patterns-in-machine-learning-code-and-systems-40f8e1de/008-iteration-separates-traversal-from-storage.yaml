title: Iteration separates traversal from storage
text: |-
  A collection's internal representation need not determine how a consumer visits its elements. The iterator pattern exposes traversal separately from the container.

  Yan uses PyTorch data loading to illustrate adjustable batching, shuffling, workers and collation. A custom collation function can assemble examples into the form the training step expects, without requiring that training step to manage the underlying traversal mechanics.
