title: A decorator adds behavior around existing code
text: |-
  A decorator wraps existing behavior with extra functionality. In Python, the familiar decorator syntax applies a function to another function and replaces it with the wrapped version.

  Yan illustrates the idea with caching, test fixtures and timing. These additions let a developer reuse a function's core behavior while attaching capabilities that would otherwise be repeated throughout its implementation or callers.
