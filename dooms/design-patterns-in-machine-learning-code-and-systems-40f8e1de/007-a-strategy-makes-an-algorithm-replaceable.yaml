title: A strategy makes an algorithm replaceable
text: |-
  The strategy pattern separates an algorithm from the code that uses it. Different implementations can be exchanged through a common contract rather than requiring the client to be rewritten.

  Yan points to configurable tree-building methods and custom objective functions in XGBoost, alongside task-oriented language-model pipelines. The flexibility depends on each replacement honoring the interface expected by the surrounding system.
