title: A factory hides creation details
text: |-
  Yan describes the factory pattern as separating an object from the details of constructing it. A common interface can simplify a complicated creation process while defining constraints that reduce mistakes.

  His examples focus on datasets. Users supply the source-specific behavior, while the surrounding library can rely on an agreed contract instead of understanding every data source's internal representation.
