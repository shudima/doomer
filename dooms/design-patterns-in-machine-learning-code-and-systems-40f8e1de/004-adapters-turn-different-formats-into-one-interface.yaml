title: Adapters turn different formats into one interface
text: |-
  A pipeline may need CSV, JSON, Parquet and other inputs to cooperate with the same downstream code. An adapter translates an incompatible representation into the expected interface.

  Yan points to readers in Pandas and Spark, and to Arrow's shared columnar representation. Standardization reduces the number of format-specific assumptions the rest of the processing pipeline must carry.
