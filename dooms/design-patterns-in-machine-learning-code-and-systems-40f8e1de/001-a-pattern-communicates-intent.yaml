title: A pattern communicates intent
text: |-
  Design patterns give developers a shared vocabulary for the problems a component solves and how it should be used. Eugene Yan illustrates this through machine-learning libraries and larger systems.

  The purpose is practical understanding, not decorating every design with terminology. Recognizing a factory, strategy or mediator can make an unfamiliar interface easier to interpret and a new implementation easier to explain.
