title: A mediator coordinates services through shared rules
text: |-
  A mediator prevents every service from needing direct knowledge of every other service's interface. Components communicate through a coordinating middle layer with agreed requirements.

  Yan notes that machine-learning services may need to integrate with an existing mediator's request schemas, latency budget or rate limits. A useful model is still part of a larger system whose coordination rules it must respect.
