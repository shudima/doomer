title: "Protect human attention in review"
text: |-
  The survey suggests capping pull-request size, with around 400 lines as an example, and splitting work into stacked changes. A human-written explanation of why the change exists helps reviewers evaluate its purpose. Authors should also identify AI-generated portions.

  For sensitive paths such as authentication, payments and personal data, the survey recommends two human reviewers. AI reviewing AI can share blind spots. Small changes and clear rationale help counter the automation bias that turns review into rubber-stamping.
