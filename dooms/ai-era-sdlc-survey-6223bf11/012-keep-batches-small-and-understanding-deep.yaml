title: "Keep batches small and understanding deep"
text: |-
  Fast generation makes large changes easy to create and hard to comprehend. The survey recommends small pull requests, feature flags and verification capacity that grows alongside generation capacity.

  It also names comprehension debt: the widening gap between code a team owns and code people understand. Deliberate code reading, design reviews, pairing with juniors and explaining submitted diffs preserve the craft. Human judgment about architecture, product trade-offs and risk remains part of the delivery system.
