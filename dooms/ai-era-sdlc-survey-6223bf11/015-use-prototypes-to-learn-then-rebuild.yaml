title: "Use prototypes to learn, then rebuild"
text: |-
  Working prototypes let product managers and designers test ideas with users early. The survey recommends connecting generation tools to the real design system, then checking empty, loading and error states, accessibility, right-to-left layouts and long text.

  For architecture, ask for several options and explicit trade-offs, then hold a human design review and record the decision. The survey advises discarding exploratory prototype code and building production software from the validated specification, so a persuasive demo does not bypass engineering review.
