title: "Adoption does not establish trust"
text: |-
  The survey reports that Stack Overflow's 2025 study of about 49,000 developers found 84% using or planning to use AI. Yet 46% distrusted its accuracy, up from 31%. It also reports 31% using agents and only 17% saying agents improved team collaboration.

  These figures describe different aspects of adoption. High usage can coexist with low confidence and limited team benefit. The survey argues that verification practices earn trust more effectively than mandates to use a tool.
