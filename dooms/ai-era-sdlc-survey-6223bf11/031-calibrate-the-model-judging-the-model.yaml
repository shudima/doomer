title: "Calibrate the model judging the model"
text: |-
  An LLM judge needs a rubric and comparison with human labels. The survey recommends binary pass/fail decisions with critiques, then measuring precision and recall against human assessments. Domain experts should help decide what quality means.

  Track task success, safety and efficiency separately rather than compressing them into one average. Repeat non-deterministic evaluations and report variation. Judge-model changes can shift scores, and generic ratings disconnected from real failures can create confidence without improving the product.
