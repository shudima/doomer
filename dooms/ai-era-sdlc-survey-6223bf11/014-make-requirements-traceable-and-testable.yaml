title: "Make requirements traceable and testable"
text: |-
  Spec-driven development puts requirements, design and tasks into a reviewed, versioned specification before implementation. The survey gives Spec Kit and Kiro as examples. Given/When/Then or EARS templates make expected behavior explicit enough to test.

  Start with real user research and link requirements to evidence. Ask AI to find ambiguity, conflicting needs and missing privacy, accessibility or latency constraints. Keep the specification short and synchronized with code; a polished document without user evidence is a weak foundation.
