title: "Triage CI failures without hiding them"
text: |-
  AI can classify a failed pipeline as a regression, flaky test, infrastructure problem or configuration issue, then attach evidence and a confidence estimate. The survey recommends running this triage separately from the job that produces the original signal.

  A flaky test changes result on the same code. Repeated retries can hide that problem. Report flake rates, assign ownership and quarantine deliberately with a tracking ticket. A repair that weakens assertions or deletes tests is not evidence that the software became correct.
