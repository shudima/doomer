title: "Days 61-90: scale with feedback"
text: |-
  The survey's final month builds a shared skills library, defaults agents to sandboxes and introduces small-change limits and stacked pull requests. Sprint plans account for reviewers. Teams pilot an incident investigation agent and mutation-test critical modules.

  An AI retrospective should update context files and working practices. Exit criteria focus on lower lead time with change failure rate flat or improved, a visible recovery-time trend and a second baseline review. Scaling earns its place through delivery and reliability evidence.
