title: "Generated tests must earn their place"
text: |-
  A generated test is useful only if it checks something meaningful. The survey recommends retaining tests that compile, pass repeatedly, add coverage or detect a plausible fault, and survive human review. This follows Meta's assured-generation approach.

  Inspect the assertion, not just the green result. A test can encode an existing bug as expected behavior, or mock away the behavior it claims to check. Generating thousands of weak tests can make the suite slower without making the product safer.
