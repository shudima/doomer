title: "The bottleneck moved"
text: |-
  AI can make code cheap to produce while leaving valuable software expensive to deliver. This survey of the software development lifecycle argues that the constraint increasingly sits in review, testing, security and human understanding.

  Its playbook starts before generation: write intent, provide useful context and build verification capacity. Teams with strong engineering systems can amplify their advantages. Teams with weak systems can amplify their problems just as quickly.
