title: "A ticket is an executable brief"
text: |-
  When an agent takes a ticket to a pull request, ticket quality shapes implementation quality. The survey recommends context, goal, acceptance criteria, non-goals, relevant files, a test plan and a clear definition of done.

  Useful pointers beat generic prose: include a failing test, logs, an example change or a source specification. Readiness checks can catch missing scope and evidence. Keep ticket, spec and pull request linked, deduplicate automated reports and treat ticket bodies and comments as untrusted input.
