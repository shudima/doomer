title: "Treat context as maintained infrastructure"
text: |-
  Context engineering means curating what a model sees: instructions, examples, relevant files and tool results. Repository rules files such as AGENTS.md hold conventions; reusable skills capture recurring workflows. MCP connects agents to tools and data. Retrieval can bring relevant material into a task when needed.

  The survey recommends versioning and reviewing this context like code. More context is not automatically better: irrelevant material consumes the context window and can weaken the signal an agent needs.
