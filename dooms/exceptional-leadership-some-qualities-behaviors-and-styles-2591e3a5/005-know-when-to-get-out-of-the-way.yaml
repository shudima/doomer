title: Know when to get out of the way
text: |-
  After supplying context and removing obstacles, leaders must also trust their teams. Imposing every idea or controlling every action can defeat the autonomy needed for experimentation and learning.

  Yan's model includes allowing people to try, fail and ultimately succeed. Enabling progress is different from making the leader the unavoidable source of permission for each meaningful decision.
