title: Vision includes what will stay stable
text: |-
  Eugene Yan describes vision as more than predicting change. Strong leaders also recognize enduring needs and build a credible direction around them.

  They communicate ambitious goals they genuinely believe in, including during difficulty, and attract people who want to help achieve them. Stable customer needs can provide a firmer foundation for strategy than guessing every upcoming trend.
