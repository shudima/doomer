title: Match leaders to the work
text: |-
  Different situations reward different leadership strengths. Some leaders learn to operate across discovery, growth and maturity, but Yan cautions against assuming everyone naturally excels at every stage.

  Self-awareness and complementary colleagues matter. Choose work that fits a leader's capabilities, develop weaker areas and assign leadership responsibilities with the situation in mind instead of treating every impressive leader as interchangeable.
