title: A vision needs execution and empathy
text: |-
  In Yan's framework, execution turns direction into results across organizational and technical boundaries. Empathy keeps customer and team needs ahead of a leader's personal ambition.

  He treats vision, execution and empathy as complementary strengths. His distinction between good and exceptional leadership is opinionated: good leaders may excel at two, while exceptional leaders combine all three.
