title: Police protect a mature system
text: |-
  Yan uses the police metaphor for leaders who maintain and improve established operations. They emphasize consistency, efficient processes and incremental gains in mature, competitive environments.

  That strength also needs vigilance against becoming trapped by the existing business. Stability and improvement should not turn into an inability to recognize when changing conditions require a more fundamental response.
