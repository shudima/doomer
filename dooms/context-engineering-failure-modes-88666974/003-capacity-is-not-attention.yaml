title: Capacity is not attention
text: |-
  A model does not retrieve a fact from context the way a database fetches a row. The presenter describes tokens as competing for a finite attention budget.

  That is why fitting more information into a window does not guarantee better use of it. The engineering problem includes deciding which information deserves to remain present, rather than only calculating how much will fit.
