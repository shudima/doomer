id: context-engineering-failure-modes-88666974-002
title: The task becomes the smallest part
text: |-
  Imagine an agent migrating an old codebase to a new database driver. Its window starts with system instructions, the task, project guidance and tool definitions. Then history and tool results accumulate.

  Files, test output, error logs and schema dumps can dwarf the original request. A short job description now sits inside an expanding record of everything the agent has seen and done.
