title: A correction can leave a clash
text: |-
  Eventually the migration agent notices that connections are not being retried. It writes a new note correcting its earlier assumption.

  Now the window contains both claims: the driver retries automatically, and it does not. Context clash is this coexistence of conflicting information. Adding the right answer is not always enough when the obsolete answer remains available to shape the next decision.
