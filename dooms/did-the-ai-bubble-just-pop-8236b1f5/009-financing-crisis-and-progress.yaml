title: A financing crisis can coexist with progress
text: |-
  Has the AI bubble popped? Fireship’s answer stays conditional. Borrowing from a company just to hand the money back to it looks fragile. That alone does not settle whether AI technology is valuable.

  As a counterpoint, the report cites OpenAI claiming a model disproved a 27-year-old complexity-theory conjecture. It is presented as OpenAI’s claim, not independent verification of the mathematical result.
