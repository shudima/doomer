title: An IPO with a compute bill
text: |-
  Into this nervous market comes Anthropic. Fireship says its public offering seeks $100 billion at a valuation above nearly every S&P 500 company, despite enormous first-half losses.

  The report highlights $265 billion in compute commitments through 2045, with major compute suppliers among the giants above it. Its S-1 runs 330 pages; 90 cover risk factors. Plenty of reading before buying the optimism.
