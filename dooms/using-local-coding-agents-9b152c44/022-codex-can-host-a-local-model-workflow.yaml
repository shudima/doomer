title: Codex can host a local model workflow
text: 'The article describes local Ollama use through the open-source Codex CLI. Raschka says the Codex
  UI did not support non-OpenAI models at the time he wrote it, so the CLI is his route for this experiment.


  He recommends a separate Ollama configuration so a normal Codex session can still use the hosted model.
  Keeping distinct launch choices avoids repeatedly replacing the settings for a working daily setup.'
