title: Connect Qwen Code to Ollama
text: 'Launch `qwen`, choose Custom Provider, and select OpenAI-compatible. For a local Ollama server,
  enter `http://127.0.0.1:11434/v1` as the base URL, including `/v1`.


  The article uses `ollama` as an API-key placeholder. Select models that are already downloaded; `ollama
  list` shows their names. This connects the harness’s coding tools to the local model server without
  changing which component is responsible for inference.'
