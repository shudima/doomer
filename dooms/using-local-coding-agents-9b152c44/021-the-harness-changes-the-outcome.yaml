title: The harness changes the outcome
text: 'In the article’s five-task agent assessment, Qwen3.6 and North Mini Code each solved four tasks
  using Qwen Code. Nemotron 3 Nano, an older model of similar size and compute needs, performed comparably.
  Gemma 4 E2B struggled.


  North Mini’s result is especially useful context: its poor score in the earlier tool-reasoning test
  did not directly predict its complete-agent result. Evaluate the model and harness together, rather
  than treating either small test as a universal ranking.'
