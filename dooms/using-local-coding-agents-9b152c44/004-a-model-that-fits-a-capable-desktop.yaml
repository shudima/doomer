title: A model that fits a capable desktop
text: 'The tutorial centers on Qwen3.6 35B-A3B, a hybrid-attention model whose download is about 22 GB
  and whose practical memory requirement is roughly 30–40 GB. Raschka reports that it runs comfortably
  on an M4 Mac Mini and a DGX Spark.


  He presents Cohere’s North Mini Code as a strong alternative in the same size class. Qwen Code can also
  connect to other model families; choosing that harness does not lock you into Qwen.'
