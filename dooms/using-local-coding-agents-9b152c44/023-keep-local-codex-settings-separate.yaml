title: Keep local Codex settings separate
text: 'Raschka’s Codex example selects `qwen3.6:35b`, the `ollama` provider, high reasoning effort, and
  a pragmatic personality. He describes launching the local configuration with `codex --profile ollama`
  while leaving the usual Codex command available for hosted use.


  The article’s configuration example is abbreviated: its separate-file description does not show the
  full provider and profile wiring. Treat it as the author’s setup outline, rather than a complete configuration
  guaranteed to work unchanged in every CLI version.'
