title: Test the complete agent on real work
text: 'A model-only reasoning test and a working coding agent measure different things. Once the harness
  is connected, try it on your actual workflow for a day or two.


  Raschka recommends keeping a small collection of representative tasks and adding difficult examples
  encountered during normal work. His public agent problem pack extends the earlier reasoning exercises
  into executable agent tasks. It offers a repeatable baseline while leaving room for the projects and
  failure modes that matter to you.'
