title: Point the launcher at the tunnel
text: 'After the SSH tunnel is working, Qwen Code and Codex can use the same endpoint configuration described
  for a local server. The model is remote, but the Mac-side address remains local.


  For Claude Code, the article explicitly sets the launcher’s endpoint: `OLLAMA_HOST=http://127.0.0.1:11434
  ollama launch claude --model qwen3.6:35b`. Stop the tunnel with Ctrl-C when finished; closing it removes
  the forwarded connection.'
