title: Read speed numbers with their caveats
text: 'In Raschka’s tests, Qwen3.6 and North Mini Code reached roughly 40 output tokens per second on
  a recent Mac Mini and 30 on a DGX, using up to about 30 GB at long contexts. He considers 20–30 tokens
  per second workable for local agents.


  These are setup-specific observations. macOS RSS measurements can misrepresent MLX memory; Activity
  Monitor showed about 20–29 GB. With similar Q4 quantization, the two models were close, with North Mini
  perhaps slightly ahead.'
