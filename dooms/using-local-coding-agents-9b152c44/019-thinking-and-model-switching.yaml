title: Thinking and model switching
text: 'The Qwen Code setup flow lets you enable thinking mode. Raschka recommends it for stronger problem
  solving, accepting the extra token use. Review the final configuration, then use `/model` to switch
  among configured models.


  After downloading another model with `ollama pull`, add a corresponding model entry in the settings
  file. For a source-built installation, updating means pulling the repository, refreshing dependencies,
  rebuilding, and checking the CLI version again.'
