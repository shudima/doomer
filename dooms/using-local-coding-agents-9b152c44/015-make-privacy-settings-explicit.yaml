title: Make privacy settings explicit
text: 'The article proposes a `~/.qwen/settings.json` configuration that disables usage statistics, telemetry,
  prompt logging, sensitive span attributes, hooks, and automatic updates. It also leaves MCP servers
  empty and sets artifact publishing to local with automatic opening off.


  Disabling updates trades automatic security fixes for deliberate version control. Raschka also warns
  that other harnesses have data-sharing defaults worth checking. These are his audit findings and configuration
  recommendations, not a guarantee that every version or integration has identical behavior.'
