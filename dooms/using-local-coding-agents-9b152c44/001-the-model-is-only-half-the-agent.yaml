title: The model is only half the agent
text: 'A local coding agent needs two cooperating layers. The language model reasons and generates code.
  The harness lets it inspect files, edit a project, run commands, and check the result.


  Sebastian Raschka’s tutorial builds that stack with open-weight models and familiar coding tools. The
  goal is a working development environment whose components you can inspect, control, and evaluate—not
  just a chatbot running on your laptop.'
