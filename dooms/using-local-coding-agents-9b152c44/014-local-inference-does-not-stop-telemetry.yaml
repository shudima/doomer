title: Local inference does not stop telemetry
text: 'Raschka’s Qwen Code audit found that local Ollama inference can coexist with outbound usage telemetry.
  Session identifiers, tool metadata, model information, and local endpoint metadata may still leave the
  machine unless reporting is disabled.


  The audit also found command approvals and write protections, with permissive modes increasing exposure.
  Repository instructions, tool output, extensions, and MCP tools remain prompt-injection surfaces. Keeping
  model requests local addresses only one part of the harness’s behavior.'
