title: Short chats hide long-context costs
text: 'Coding agents accumulate file contents, tool output, and conversation history. A model that feels
  quick in a short chat may slow down or consume much more memory during repository work.


  Raschka’s speed script tests prompts ranging from 1,000 to 50,000 words and requests up to 8,000 generated
  tokens. It reports prefill speed, output speed, process memory, and NVIDIA GPU memory when available.
  Check both responsiveness and memory as context grows.'
