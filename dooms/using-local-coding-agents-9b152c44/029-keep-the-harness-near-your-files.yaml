title: Keep the harness near your files
text: 'The model server and coding harness do not have to run on the same computer. Raschka describes
  keeping the harness on a Mac while serving the model from a DGX Spark.


  An SSH tunnel makes the remote server appear at the familiar local Ollama endpoint. The harness can
  work with the Mac’s project files while the other machine supplies the inference compute. This is a
  split-machine setup under your control, rather than same-machine inference.'
