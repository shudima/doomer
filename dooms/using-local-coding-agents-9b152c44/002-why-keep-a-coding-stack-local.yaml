title: Why keep a coding stack local?
text: 'Local models offer privacy, offline use, and predictable running costs once you own suitable hardware.
  Electricity and the machine still cost money, but there is no per-request model bill.


  They also let you keep a particular model version instead of accepting a service upgrade that might
  change an established workflow. Raschka still primarily uses Codex and Claude Code; his local setup
  is a practical alternative and an enjoyable experiment, rather than a claim that hosted tools are obsolete.'
