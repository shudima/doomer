title: Your familiar harness is worth a trial
text: 'The article’s small experiments challenge the assumption that an open-weight model must work best
  in its native harness. If you already know Codex or Claude Code well, connecting a local model there
  may be a sensible starting point.


  Keep the benchmark caveat in view, then test your own tasks. Raschka shares his scripts and problem
  pack in `rasbt/local-coding-agent-evals` so readers can reproduce and extend the experiments. The final
  invitation is to tinker, measure, and learn.'
