title: Vibe coding favors exploration
text: |-
  In the presenter’s framing, vibe coding means describing intent in natural language and iteratively shaping the result. The developer spends more effort on creative direction and less on manually implementing each line.

  That makes it useful for quick experiments and prototypes. Its place on the spectrum reflects a change in how work is directed, with important engineering questions still waiting beyond the first working result.
