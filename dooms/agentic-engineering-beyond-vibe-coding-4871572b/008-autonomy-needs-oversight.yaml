title: Autonomy needs oversight
text: |-
  The presenter argues that greater autonomy can increase the value of human oversight. Someone still needs to ensure reliability across probabilistic workflows.

  Engineering expertise keeps experimentation accountable and checks whether the result is fit for purpose. Agents may accelerate development, while the team operating them remains responsible for quality.
