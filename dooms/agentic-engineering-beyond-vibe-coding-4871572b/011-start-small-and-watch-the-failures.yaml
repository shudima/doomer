title: Start small and watch the failures
text: |-
  The names for AI-assisted development will keep changing as the tools improve. The presenter’s practical suggestion is to try them within an existing workflow and notice where they help and where they break.

  Build outward from that experience. The closing caution is to keep understanding and quality in the process: automating more work does not remove the need to understand what the resulting system does.
