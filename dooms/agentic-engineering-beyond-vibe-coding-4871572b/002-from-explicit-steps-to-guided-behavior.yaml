title: From explicit steps to guided behavior
text: |-
  Traditional programming explicitly specifies control flow, retries, permissions, validation and edge cases. Under the same conditions, developers expect the same behavior.

  An agent combines goal interpretation with memory, tools, planning and feedback. The presenter describes the difference as writing behavior versus shaping behavior. Probabilistic judgment introduces a new engineering problem: designing the conditions under which a system chooses and acts.
