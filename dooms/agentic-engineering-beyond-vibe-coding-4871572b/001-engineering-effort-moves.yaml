title: Engineering effort moves
text: |-
  AI-assisted and agentic coding are changing the familiar route from computer science to software engineering. The presenter describes a shift toward defining goals while agents handle more of the execution.

  Software engineering still supplies the expertise behind the work. The change is in where that effort is spent: increasingly on directing, supervising and validating a process that includes autonomous components.
