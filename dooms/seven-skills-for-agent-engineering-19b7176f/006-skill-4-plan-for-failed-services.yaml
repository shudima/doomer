title: 'Skill 4: plan for failed services'
text: |-
  Agents call APIs, and APIs can fail or time out. An agent can wait indefinitely or repeat the same unsuccessful request unless the system defines another path.

  The presenter recommends familiar reliability tools: retries with backoff, timeouts, fallback options and circuit breakers. Backend engineers already know much of this playbook. The model’s intelligence does not remove the failure modes of the services it depends on.
