title: 'Skill 1: design the system'
text: |-
  An agent combines a model, tools, state storage and sometimes other models or specialist agents. Those pieces need to cooperate without interfering with one another.

  System design asks how data moves, what happens when a component fails, and how a task coordinates several specialists. The presenter connects this directly to backend architecture: existing experience designing interacting services carries over to building agent systems.
