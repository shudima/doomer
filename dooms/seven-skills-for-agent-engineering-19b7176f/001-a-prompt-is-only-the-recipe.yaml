title: A prompt is only the recipe
text: |-
  The presenter jokes about a prompt-engineer vacancy asking for distributed systems, API design, operations, security and product expertise. The title sounds too small for the work.

  An agent takes actions, queries systems and makes decisions. Building one resembles being a chef: the recipe matters, but so do the ingredients, timing, workflow and recovery when something goes wrong. The job requires engineering the surrounding system.
