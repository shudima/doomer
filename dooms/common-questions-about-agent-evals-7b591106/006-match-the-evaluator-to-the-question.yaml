title: Match the evaluator to the question
text: |-
  Code checks are fast and consistent for deterministic properties, such as staying within a budget. LLM judges handle qualities that are harder to encode. Human review supplies expert judgment and checks the automated evaluators.

  Pairwise evaluation compares two outputs directly, which helps choose between prompts or models. Most teams can start with one or two methods rather than building every kind at once.
