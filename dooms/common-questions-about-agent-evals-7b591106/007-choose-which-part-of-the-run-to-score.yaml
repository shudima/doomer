title: Choose which part of the run to score
text: |-
  An evaluator can inspect one tool call, the final response, the whole conversation, or the state left in an environment. These answer different questions.

  For a travel assistant, checking a search date catches a step-level mistake; checking the booking database verifies what was actually reserved. A clear final message alone cannot establish that the agent performed the right action.
