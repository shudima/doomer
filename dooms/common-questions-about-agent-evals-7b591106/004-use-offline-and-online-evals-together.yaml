title: Use offline and online evals together
text: |-
  Offline evals run controlled examples before shipping, often with reference outputs, to compare prompts, models, or tools and catch regressions. Online evals score real production traces, usually without a reference answer.

  Online monitoring finds situations the offline dataset missed. Feeding those failures back into the dataset connects release checks with actual user experience instead of treating them as separate quality programs.
