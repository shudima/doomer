title: A correct answer can hide a bad run
text: |-
  Agent outputs vary, several answers can be valid, and the path matters as well as the final response. An assistant might return the right result after using an unnecessary tool or acting without permission.

  Evals score the behavior you actually care about. LangChain’s guide treats them as product-specific checks, rather than one universal test that can certify every agent.
