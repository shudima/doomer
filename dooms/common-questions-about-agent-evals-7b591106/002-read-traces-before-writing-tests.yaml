title: Read traces before writing tests
text: |-
  A trace records a run’s inputs, outputs, model calls, and tool calls. Read a sample to see what the agent does and where it fails, then choose one important behavior to evaluate first.

  The article suggests starting with ten to twenty examples drawn from real traces. Before production, dogfooding with teammates or trusted design partners can supply those examples.
