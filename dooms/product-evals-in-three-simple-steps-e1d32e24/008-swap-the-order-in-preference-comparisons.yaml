title: Swap the order in preference comparisons
text: |-
  A pairwise judge may favor a response's position or label rather than its substance. Yan evaluates a pair twice, swapping which response occupies each slot.

  A consistent evaluator should still prefer the same response. If reversing the order reverses the winner, treating the result as a tie can be more useful than pretending the comparison produced a dependable distinction.
