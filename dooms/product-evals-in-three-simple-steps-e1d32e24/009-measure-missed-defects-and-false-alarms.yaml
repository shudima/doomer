title: Measure missed defects and false alarms
text: |-
  For a pass/fail judge, inspect precision and recall on the failure class. High recall helps catch defects; precision prevents too many acceptable outputs from being flagged.

  Agreement metrics such as Cohen's kappa add another view of consistency against human labels. Yan's point is to evaluate the evaluator itself, using the kinds of errors that matter for the product.
