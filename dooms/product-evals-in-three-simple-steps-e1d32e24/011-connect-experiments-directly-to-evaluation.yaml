title: Connect experiments directly to evaluation
text: |-
  A useful harness accepts experiment outputs, runs the relevant evaluators within service limits and aggregates their results. Yan also favors a simple, portable metrics table that stakeholders can compare.

  Connecting this harness directly to the experiment pipeline closes the loop. A change to retrieval, prompts or model configuration can generate outputs and receive comparable evaluation without a separate manual handoff.
