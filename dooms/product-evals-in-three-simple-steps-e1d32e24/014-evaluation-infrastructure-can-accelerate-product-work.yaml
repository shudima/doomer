title: Evaluation infrastructure can accelerate product work
text: |-
  Yan describes a team spending roughly four weeks on criteria, labels, judges and an experiment harness. The apparent detour then supported dozens of experiments within two weeks and hundreds more over subsequent months.

  His conclusion is about iteration speed as well as measurement. Product evaluations make systematic improvement feasible when human review after every configuration change would otherwise become the bottleneck.
