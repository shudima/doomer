title: Collect enough genuine failures
text: |-
  A large labeled dataset can still be unhelpful if it contains almost no defects. Yan suggests roughly 50–100 failures among more than 200 examples as a practical starting point, subject to the task.

  Less capable models can produce realistic mistakes. Deliberately fabricated defects may look unlike production failures, so an initially synthetic dataset should progressively incorporate organic examples.
