title: Give each evaluator one criterion
text: |-
  A single prompt judging faithfulness, relevance, brevity and tone is difficult to calibrate. When its verdict changes, the team may not know which criterion caused the change.

  Yan recommends separate evaluators with simple combination rules. This makes weaknesses visible and allows different release policies: one dimension may block shipping, while another represents a quality target the team improves over time.
