title: More examples narrow uncertainty slowly
text: |-
  In Yan's illustrative calculation, increasing the sample from 200 to 400 narrows the approximate interval around a 3% defect rate enough to put its upper bound below 5%.

  There are diminishing returns. Standard error falls with the square root of sample size, so halving the margin of error requires about four times as many examples under the same assumptions.
