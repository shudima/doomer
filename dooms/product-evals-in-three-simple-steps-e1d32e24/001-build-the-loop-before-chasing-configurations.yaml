title: Build the loop before chasing configurations
text: |-
  Eugene Yan organizes product evaluation into three connected steps: label examples, align automated evaluators with those judgments, and run the resulting harness whenever the system changes.

  The outcome is a faster learning process. Instead of manually inspecting outputs after every prompt, retrieval or model change, a team gains a repeatable way to discover improvements and detect regressions.
