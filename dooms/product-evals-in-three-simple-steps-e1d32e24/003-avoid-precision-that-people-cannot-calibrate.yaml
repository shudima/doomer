title: Avoid precision that people cannot calibrate
text: |-
  A five-point scale looks more detailed, but neighboring scores can mean different things to different annotators. If people cannot consistently distinguish them, an automated judge will struggle to reproduce the distinction too.

  Yan favors simpler decision boundaries. In his experience, stakeholders often end up requesting a pass rate anyway, making an elaborate scoring scale unnecessary work at the start.
