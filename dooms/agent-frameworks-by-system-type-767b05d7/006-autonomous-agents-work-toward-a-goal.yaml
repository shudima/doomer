title: Autonomous agents work toward a goal
text: |-
  An autonomous setup starts with a goal and lets the agents work out how to accomplish it. The example is a coding assistant with planning, coding and review work.

  Agents communicate, propose changes and help debug the result. The presenter places this approach with open-ended problems, where the useful next step may emerge from the work instead of following a fully predetermined sequence.
