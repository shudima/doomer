title: Match the system
text: |-
  The video closes with five questions. Is the work predictable, exploratory, organized around teammates, headed into production, or still testing an idea?

  Those answers point toward workflows, autonomous agents, role-based systems, production orchestration or visual prototyping. The best framework choice follows what the system must do. A pipeline, a team and a production service do not all need the same starting architecture.
