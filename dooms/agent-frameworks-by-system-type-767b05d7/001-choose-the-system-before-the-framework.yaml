title: Choose the system before the framework
text: |-
  Seventeen tabs of agent frameworks can leave you no closer to a decision. The video proposes starting with the kind of system you want to build.

  A predictable pipeline, an exploratory group of agents and a production operations system place different demands on their toolkit. Understanding those demands makes the comparison among frameworks meaningful, instead of searching for a single winner across every project.
