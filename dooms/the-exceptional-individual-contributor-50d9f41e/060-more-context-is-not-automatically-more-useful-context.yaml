title: More context is not automatically more useful context
text: |-
  Context engineering decides which instructions, evidence, tool results and history the model sees at each step. The survey treats this as management of a limited resource rather than only improving one prompt's wording.

  Long histories can bury relevant constraints among irrelevant material. Before blaming reasoning alone, inspect whether the model received the right information and whether it remained accessible at the moment of failure.
