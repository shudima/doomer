title: Busy work can conceal the wrong portfolio
text: |-
  The survey names three traps. Snacking is comfortable work with limited impact. Preening produces visibility without much change. Chasing ghosts imports a previous employer's diagnosis before understanding the current system.

  All can feel productive. The useful check is whether the work addresses a real local need at the scope of the role, rather than merely rewarding technical enjoyment or public recognition.
