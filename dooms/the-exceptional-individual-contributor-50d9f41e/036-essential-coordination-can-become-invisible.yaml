title: Essential coordination can become invisible
text: |-
  Onboarding, connecting teams, reviewing designs and noticing dropped responsibilities help a team function. The survey describes these contributions as glue work and treats them as part of senior IC responsibility.

  Unrecognized glue work can also damage a less senior engineer's career if advancement depends on visible implementation. Notice who carries these responsibilities, share the load fairly and make the outcomes part of an explicit account of impact.
