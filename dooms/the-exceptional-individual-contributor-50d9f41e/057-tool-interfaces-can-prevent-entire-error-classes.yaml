title: Tool interfaces can prevent entire error classes
text: |-
  An agent-computer interface is the set of tools, parameters and explanations a model uses to act. The survey recommends clear names, unambiguous inputs and formats that are difficult to misuse.

  It cites an example where requiring absolute file paths eliminated a class of errors. The broader principle is to redesign confusing interfaces instead of repeatedly asking a model to compensate for avoidable ambiguity.
