title: Capability, regression and saturation need different responses
text: |-
  A capability evaluation tests behavior the system does not yet perform reliably. A regression evaluation protects behavior that already works. Their expected starting pass rates are therefore different.

  The glossary also describes saturation: a suite that almost everything passes no longer separates stronger from weaker candidates. Keep protecting established behavior while adding meaningful challenges instead of mistaking a saturated suite for complete product quality.
