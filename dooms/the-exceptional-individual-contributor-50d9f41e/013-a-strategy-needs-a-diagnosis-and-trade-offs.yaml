title: A strategy needs a diagnosis and trade-offs
text: |-
  The survey uses Richard Rumelt's strategy kernel: diagnose what is happening, choose a guiding policy and define actions that reinforce that policy. A diagnosis should be specific enough that someone could challenge it.

  A list of goals or approved technologies is insufficient. A useful strategy explains why the approach fits the constraints and identifies alternatives the organization will deliberately not pursue.
