title: Archetypes describe work, not permanent identities
text: |-
  The survey presents Will Larson's four archetypes: Tech Lead, Architect, Solver and Right Hand. They describe coordinating teams, directing a technical domain, resolving a hard problem or extending a senior leader's reach.

  One person can combine these modes or change between them. Choosing an archetype permanently can become a trap if the organization now needs a different kind of contribution.
