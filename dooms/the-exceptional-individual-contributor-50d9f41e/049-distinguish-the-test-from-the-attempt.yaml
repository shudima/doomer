title: Distinguish the test from the attempt
text: |-
  A task defines an input and success criteria. A trial is one attempt at that task, and a grader assesses some part of its outcome. Several trials may be needed because model behavior varies.

  A curated evaluation dataset supplies stable reference cases or labels. Separating these concepts makes results easier to interpret than reporting one score without explaining which cases were tested or how often they ran.
