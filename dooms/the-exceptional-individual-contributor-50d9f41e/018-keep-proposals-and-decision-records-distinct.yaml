title: Keep proposals and decision records distinct
text: |-
  A design proposal explains the problem, goals, non-goals, alternatives and risks before a choice. An architecture decision record captures the significant choice that was made, its context and consequences.

  The survey recommends both at an appropriate size. A durable decision log helps future engineers understand why a system looks the way it does instead of repeatedly reopening debates whose original reasoning has disappeared.
