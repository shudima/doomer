title: 'Months four to six: land one bounded strategy'
text: |-
  After learning the local situation, write a strategy for a defined area such as safe model changes or shared tracing. Explain the diagnosis, guiding policy, coherent actions and deliberate exclusions.

  Discuss it with important stakeholders before formal decision-making and establish a review mechanism. The survey favors an adopted, maintainable strategy for a real area over a sweeping vision nobody uses.
