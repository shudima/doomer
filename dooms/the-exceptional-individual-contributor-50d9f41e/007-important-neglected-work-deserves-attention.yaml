title: Important neglected work deserves attention
text: |-
  The survey prioritizes existential threats when they exist. Beyond those, it recommends looking for important problems nobody owns, opportunities to grow others, small interventions that unblock work and stalled projects that need finishing.

  These categories can matter more than another elegant new implementation. Their common feature is changing the outcome of work that would otherwise remain ineffective, incomplete or unnecessarily dependent on one person.
