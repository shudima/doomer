title: Mentoring teaches; sponsorship opens a door
text: |-
  Mentoring helps someone improve through feedback, explanation and opportunities to practice. Sponsorship uses reputation and access to create an opportunity the person might not otherwise receive.

  The survey recommends both, including mentoring within ordinary work rather than only scheduled sessions. Recommending someone to lead a visible initiative or naming their contribution in an influential room does something advice alone cannot accomplish.
