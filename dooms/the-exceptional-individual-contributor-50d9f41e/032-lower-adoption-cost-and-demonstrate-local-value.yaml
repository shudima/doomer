title: Lower adoption cost and demonstrate local value
text: |-
  In a composite example, teams resist a common tracing format because deadlines make migration seem expensive. The principal builds an adapter for one team's existing logs and uses the resulting traces to find a silent failure.

  That concrete benefit changes the conversation. The remaining proposal is discussed in terms of each stakeholder's needs, such as debugging time or an audit, instead of relying only on architectural consistency.
