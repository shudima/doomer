title: Exceptional work extends beyond personal output
text: |-
  The Exceptional Individual Contributor surveys practitioner advice for staff and principal engineers, especially people moving into principal AI roles. Its central question is how technical expertise produces outcomes beyond one person's implementation work.

  This is a synthesis of professional guidance, not a controlled study. The document explicitly identifies its company stories as illustrative composites rather than reports about particular organizations.
