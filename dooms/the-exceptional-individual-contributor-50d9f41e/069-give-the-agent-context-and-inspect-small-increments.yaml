title: Give the agent context and inspect small increments
text: |-
  The survey recommends durable project context, reviewing a plan before implementation, automatic checks and small changes that can be inspected. Production code should receive at least the rigor applied to a human contribution.

  Prototypes permit more exploration, but their results still need verification before informing important choices. The disciplined process matters more than whether the code was originally typed by a person or generated by a model.
