title: Production visibility needs intermediate actions
text: |-
  A final answer does not explain the sequence that produced it. The survey recommends traces containing model and tool calls, their inputs and outputs, timing and cost, in a form that can be searched and replayed.

  Sampling production requests for evaluation adds another view. Plausible but wrong answers can otherwise remain invisible until a customer complains, even when the service reports no conventional errors.
