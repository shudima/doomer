title: Match deliberation to reversibility
text: |-
  Some choices can be reversed cheaply, while others create commitments that are expensive to undo. The survey recommends fast, local decisions for the former and more careful analysis for the latter.

  Neither endless review nor impulsive speed fits every situation. Recognizing the type of decision early helps a principal prevent both stalled experimentation and poorly understood commitments with long-lived consequences.
