title: Scope grows while your time does not
text: |-
  The survey defines senior technical roles through scope and leverage. Scope is the problem space for which someone is accountable; leverage is how much impact their limited time produces through systems and other people.

  Titles vary between companies. The meaningful transition is toward responsibility beyond a single team, rather than simply becoming the engineer who personally writes the most difficult code.
