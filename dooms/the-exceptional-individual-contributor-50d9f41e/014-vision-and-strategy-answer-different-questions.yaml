title: Vision and strategy answer different questions
text: |-
  A technical vision describes a recognizable future state. A strategy explains how to move toward it from the present under real constraints.

  The survey treats both as necessary. Vision without an executable approach can drift into aspiration; strategy without a destination can optimize current arrangements indefinitely. The relationship matters more than producing impressive documents with either label on the cover.
