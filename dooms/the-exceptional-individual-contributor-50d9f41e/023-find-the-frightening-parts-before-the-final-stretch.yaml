title: Find the frightening parts before the final stretch
text: |-
  A premortem imagines the project has already failed and asks participants why. The survey recommends using it to surface risks people may otherwise leave unspoken.

  It also favors tackling difficult changes early and releasing incrementally behind feature flags, which can enable or disable a path without a fresh deployment. Repeatedly asking what prevents shipping makes unresolved dependencies and unclear finish lines harder to hide.
