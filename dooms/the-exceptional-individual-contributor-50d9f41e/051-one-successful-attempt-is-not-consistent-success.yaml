title: One successful attempt is not consistent success
text: |-
  Pass@k asks whether at least one of several attempts succeeds. Pass^k asks whether every attempt succeeds. The survey recommends choosing the summary that matches the user's need rather than selecting whichever number looks better.

  For independent attempts each succeeding 75% of the time, three successes in a row occur only about 42% of the time. Reliability-sensitive experiences can therefore look much weaker than a single-trial success rate suggests.
