title: An update should make the decision clear
text: |-
  The survey contrasts an activity report with an illustrative recommendation to delay a model upgrade. The stronger update explains which request category regresses, why it matters and what happens next.

  It also states whether the reader needs to decide anything. Especially for AI results, communicate what was measured, on which data, with what uncertainty and what that evidence means for the proposed action.
