title: Separate measured evidence from confidence
text: |-
  Strong judgment includes saying what you do not know. The survey recommends making confidence explicit, distinguishing observations from beliefs and changing a position when the evidence changes.

  A decision journal creates feedback: record a significant choice, its predicted outcome and what later happened. Without this comparison, a person can accumulate years of decisions without learning whether their explanations actually predicted the results.
