title: Name the decider and support the outcome
text: |-
  Inviting input is not the same as identifying who can close a decision. The survey recommends making that responsibility explicit, for example directly on the proposal.

  It also describes disagreeing openly during deliberation and then supporting the selected direction. New evidence can justify revisiting a decision; quietly undermining it or repeating an old argument without new information creates a different organizational problem.
