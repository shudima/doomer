title: An adopted policy needs an operating mechanism
text: |-
  In a composite example, incompatible model access and missing evaluations motivate a shared gateway, evaluation requirements and measured model selection. The strategy explicitly postpones self-hosting and permits teams to retain orchestration code.

  Migration, tracing and regular model reviews reinforce one another. The survey's point is that strategy needs concrete adoption steps and a review process for exceptions and updates, not just an announcement.
