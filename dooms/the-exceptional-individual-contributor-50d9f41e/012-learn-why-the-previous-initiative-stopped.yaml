title: Learn why the previous initiative stopped
text: |-
  In the survey's composite onboarding example, a principal learns that centralized prompt management previously frustrated product teams and that security has important approval responsibilities around customer data.

  That history changes the next proposal. A shared evaluation platform is framed around each team's existing metrics and involves security early. The example shows organizational investigation reducing preventable resistance, rather than treating resistance as a purely technical disagreement.
