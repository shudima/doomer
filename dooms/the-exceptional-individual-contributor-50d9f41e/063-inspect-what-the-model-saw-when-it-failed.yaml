title: Inspect what the model saw when it failed
text: |-
  In a composite example, a research agent repeats searches and loses user constraints after accumulating large raw results. The team changes search outputs, adds running notes, compacts older history and isolates detailed investigations.

  The story illustrates diagnosing the contents of context before changing model reasoning prompts. Its reported improvement is part of the fictional example, not independent evidence about a real deployed system.
