title: Two choices can require different processes
text: |-
  In the survey's composite example, a vector store behind an internal interface receives a short comparison and a local decision. The choice between a fixed workflow and a more autonomous support agent gets broader review because it affects evaluation, safety and customer expectations.

  The resulting record includes criteria for reconsideration. The lesson is proportional decision-making, not a universal claim that every storage choice is easily reversible.
