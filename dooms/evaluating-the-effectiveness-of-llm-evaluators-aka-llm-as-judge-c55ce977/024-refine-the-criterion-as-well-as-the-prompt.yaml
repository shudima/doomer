title: Refine the criterion as well as the prompt
text: |-
  EvalLM gives users model judgments and explanations, alongside help refining, merging or separating evaluation criteria. Yan reports that more specific criteria aligned better with human annotations in the study.

  The interface also helped participants inspect more examples and revise their criteria. Evaluation quality depends partly on making the intended standard explicit enough for both people and models to apply it consistently.
