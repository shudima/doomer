title: Inspect the confusion matrix behind a correlation
text: |-
  UMbrela grades search passages for relevance. In the results Yan discusses, rank correlations with human labels looked strong, while chance-adjusted agreement and per-label classification performance were much less reassuring.

  This reveals a gap between broadly ordering results and correctly assigning each relevance category. When a category triggers a product decision, inspect those decisions directly instead of relying only on a high ranking statistic.
