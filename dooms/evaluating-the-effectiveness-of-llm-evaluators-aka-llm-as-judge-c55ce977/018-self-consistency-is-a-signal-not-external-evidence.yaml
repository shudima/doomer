title: Self-consistency is a signal, not external evidence
text: |-
  SelfCheckGPT compares a target answer with additional samples from the model. Agreement across samples is used as evidence that the model's statements are stable, while disagreement suggests possible hallucination.

  Yan notes stronger results for obvious errors than partially false sentences. A smaller natural-language-inference model also performed competitively, illustrating the need to compare quality against the compute required by repeated sampling.
