title: Choose the baseline before judging success
text: |-
  A judge can look efficient beside human review and expensive beside a small trained classifier. Yan argues that these are different comparisons with different expectations.

  Matching human agreement may justify an evaluation assistant, while replacing a production classifier also requires competitive defect detection, latency and cost. Define the alternative before deciding whether the language-model judge is actually an improvement.
