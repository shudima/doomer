title: Direct scoring checks an individual answer
text: |-
  Direct scoring evaluates one response against a criterion without requiring a competing response. Yan favors this setup for objective requirements such as support from a source or compliance with a policy.

  A comparison only identifies the better member of a pair. If both are defective, a winner still fails the requirement; an absolute check needs to be able to reject both.
