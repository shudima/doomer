title: Ranking candidates is not rejecting defects
text: |-
  Cappy is a relatively small scorer trained to assess instruction-response pairs. In the reviewed experiments, it can improve a generator by selecting among candidate outputs and can perform some classification tasks directly.

  Yan keeps the claim narrow. Evidence that a model ranks candidates effectively does not establish that it can reliably detect and exclude unacceptable outputs when used as an absolute quality gate.
