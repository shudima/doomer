title: Development judges and production gates have different budgets
text: |-
  A development harness evaluating a few hundred examples can often tolerate the cost of a prompted language-model judge. A high-throughput production guardrail may need the latency and economics of a specialized classifier or reward model.

  Yan recommends choosing deliberately between these settings. Collecting internal labels and measuring real performance provide a path from a useful experimental evaluator toward an operationally appropriate system.
