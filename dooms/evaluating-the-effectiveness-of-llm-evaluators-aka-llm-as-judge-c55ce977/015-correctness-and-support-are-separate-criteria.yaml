title: Correctness and support are separate criteria
text: |-
  A question-answering response may satisfy the user's information need while exceeding what the supplied material supports. The study Yan reviews evaluates correctness and faithfulness separately.

  Its strongest tested judge correlated better with people on correctness than on faithfulness. The result reinforces a practical distinction: judging whether an answer is useful or true is not identical to judging whether its cited context justifies it.
