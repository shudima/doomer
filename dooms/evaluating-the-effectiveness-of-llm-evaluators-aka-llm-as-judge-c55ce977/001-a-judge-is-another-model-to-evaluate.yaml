title: A judge is another model to evaluate
text: |-
  Open-ended answers are difficult to assess with word overlap or one reference response. Eugene Yan surveys research on using language models to judge other model outputs.

  The promise is scalable evaluation, but it creates another component whose reliability must be measured. The article compares tasks, prompting methods, human alignment and specialized judges rather than treating a strong model as an automatically trustworthy reviewer.
