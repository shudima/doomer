title: Prompt sensitivity complicates calibration
text: |-
  Few-shot examples do not automatically make a judge stable. In the reviewed consistency experiments, changing example order, labels or the number of examples could change performance unpredictably.

  Yan also questions comparisons that assume an already-correct reference summary is available. Calibration should test the actual intended setup, including realistic references and prompt variations, rather than an easier version of the deployment problem.
