title: CriticGPT can augment human code review
text: |-
  CriticGPT is trained to identify potential problems in generated code. Its data includes naturally occurring bugs and deliberately inserted bugs designed to challenge detection.

  Yan reports that the specialized critic caught more inserted bugs than human contractors, and that people assisted by it caught more than people working alone. The value includes augmentation, rather than requiring the system to replace human review entirely.
