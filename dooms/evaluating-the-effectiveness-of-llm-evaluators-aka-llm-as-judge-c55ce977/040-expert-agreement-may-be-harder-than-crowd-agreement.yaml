title: Expert agreement may be harder than crowd agreement
text: |-
  A study across 20 tasks found wide variation in model alignment with human judgments. Every evaluated model performed poorly somewhere, and agreement was generally higher with non-expert than expert annotators.

  Yan cautions against using one favorable human-correlation result as a replacement guarantee. The expertise of the annotators and the diversity of tested tasks materially change what the evidence supports.
