title: Position and length can distort preference
text: |-
  The chatbot studies Yan reviews identify preferences for particular response positions and for longer answers, even when the extra words add no information.

  Those are evaluation artifacts rather than genuine quality improvements. Reversing response order and testing length-controlled alternatives can help reveal whether a judge is rewarding the intended criterion or merely reacting to presentation features.
