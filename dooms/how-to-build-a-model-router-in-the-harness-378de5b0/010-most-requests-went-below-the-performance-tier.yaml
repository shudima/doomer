title: Most requests went below the performance tier
text: |-
  Of routed threads, 56% went to balanced, 34% to fast, and 10% to performance. Median costs were $0.097, $1.50, and $2.88 respectively—a steep ladder between tiers.

  Feedback also identified simple requests that seemed overprovisioned on the strongest model. The useful insight is workload diversity: many requests did not need the top tier, even though some still benefited from it.
