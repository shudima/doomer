title: Treat routing as context engineering
text: |-
  The article’s implementation recipe is to understand real tasks, research model options, build domain-specific criteria in the harness, and track outcomes. Observability and evaluations supply the feedback needed to revise the policy.

  Model tiers should remain replaceable as capabilities and prices change. Routing is therefore an ongoing product decision grounded in measured task success, rather than a one-time gateway rule that chooses the cheapest name.
