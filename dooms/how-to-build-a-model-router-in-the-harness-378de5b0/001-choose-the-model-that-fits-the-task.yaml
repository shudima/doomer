title: Choose the model that fits the task
text: |-
  Using the strongest model for every request can buy little extra quality while increasing cost and latency. LangChain argues that a router should choose the least expensive model likely to finish the actual task.

  That decision belongs in the harness, the article says, because it already assembles domain knowledge, tools, and task context. A generic gateway typically sees less of the information needed to judge model fit.
