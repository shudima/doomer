title: Define success before optimizing cost
text: |-
  A cheaper route is useful only if quality remains acceptable. Offline datasets make comparisons repeatable, but need representative tasks and meaningful grading. Live A/B tests naturally see real requests, while exposing users to possible routing mistakes.

  Open SWE tracked merged pull requests per thread and thumbs-up or thumbs-down feedback. Merges supplied the stronger measurable signal; feedback was sparse but helped reveal individual mistakes.
