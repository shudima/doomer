title: Pick tiers along the cost-quality frontier
text: |-
  LangChain chose three tiers using benchmark comparisons: GLM-5.3-Flash at xhigh for fast work, GPT-5.6 Sol at medium for balanced work, and GPT-6 Astra at low for performance.

  Those were the article’s dated model choices, not permanent recommendations. A model-agnostic interface lets the team replace a tier when the cost-performance frontier moves without rebuilding the surrounding agent.
