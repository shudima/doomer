title: No measurable regression is not proof of equality
text: |-
  The strongest-model A/B test covered 973 threads. Routed threads produced merged pull requests 29.2% of the time versus 27.3% for control, with p = 0.49. Pull-request opening rates were also similar.

  The authors report no measurable quality change on those signals. The results do not demonstrate that every task, code-quality dimension, or individual routing decision was equally good.
