title: A skill teaches a particular procedure
text: |-
  An agent already knows many general facts. A skill supplies a particular way to perform a particular job: procedural knowledge the model would not otherwise have about your work.

  The format can be simple, with a SKILL.md file inside a folder. The value comes from what that folder teaches, rather than from repeating familiar advice the model could have produced without it.
