title: Save the corrections as gotchas
text: |-
  A valuable skill records environment-specific facts that defy reasonable assumptions. The video calls these gotchas.

  Every correction you repeatedly make to an agent is a candidate. Writing it into the procedure gives later runs access to knowledge that otherwise remains in your head. Without that record, the next run may force you to teach the same exception again.
