title: 'Practice 3: spend context carefully'
text: |-
  When an agent selects a skill, its body joins the rest of the active context. Every line competes for attention, so detailed instructions also carry a cost.

  The presenters suggest keeping the main body under about 500 lines, with roughly 5,000 tokens offered as another rough size guide. Focus that space on what the agent would not know by itself, rather than explaining general concepts it already understands.
