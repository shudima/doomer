title: An expensive mistake needs more certainty
text: |-
  If a model is calibrated, a threshold gives an approximate sense of how often its automatic decisions will be wrong. That lets the application connect uncertainty to the cost of a mistake.

  The presenter’s rule is simple: raise the threshold when an error would be more costly. The goal is to choose where automation is acceptable and where a person should intervene.
