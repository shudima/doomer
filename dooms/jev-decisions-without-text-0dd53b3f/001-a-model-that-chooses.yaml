title: A model that chooses
text: |-
  Jev does not answer by writing a paragraph. The model, from TypeSafe, selects among answers you supply and returns probabilities for them.

  That makes its output look more like a software decision than a chat response. The useful question becomes which option to choose, and how uncertain that choice is, rather than how to generate convincing prose.
