title: What calibration means
text: |-
  Imagine collecting many decisions to which a model assigns 80% probability. A well-calibrated model should be right on about 80% of those decisions.

  Calibration describes the relationship between predicted probability and observed outcomes across cases. It does not turn an individual prediction into a guarantee. The video uses this relationship to explain why numerical uncertainty can become useful input to application logic.
