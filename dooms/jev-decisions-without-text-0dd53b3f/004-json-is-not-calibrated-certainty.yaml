title: JSON is not calibrated certainty
text: |-
  An LLM can classify a support email and return the result as JSON. That gives software a convenient format, but it does not automatically give a reliable measure of uncertainty.

  Asking the model how confident it feels adds another generated answer. The presenter distinguishes that self-reported confidence from a model trained to make its numerical probabilities match how often its decisions are correct.
