title: Route uncertainty to a human
text: |-
  The support example uses two illustrative thresholds. Above 0.9, send the email to the refund queue. Below 0.1, treat it as something other than a refund request. Between those values, ask a person to check.

  The model supplies a probability; ordinary code determines the path. These numbers illustrate a design, rather than prescribing universal thresholds for every refund system.
