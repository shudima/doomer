title: Guardrails have limits too
text: |-
  Jev could check messages entering or leaving a chatbot for things such as jailbreak attempts. That makes classification useful as a guardrail around a larger system.

  The presenter also lists limits: Jev takes text, struggles with mathematics and counting, and can be tricked by instructions hidden in the data it reads. A decision model remains an AI component with failure modes.
