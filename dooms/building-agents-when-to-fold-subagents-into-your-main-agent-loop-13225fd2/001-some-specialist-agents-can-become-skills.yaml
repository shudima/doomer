title: Some specialist agents can become skills
text: |-
  Anthropic reports enterprise deployments where a single agent using skills outperformed both an all-in-one prompt and a network of subagents, often with lower cost and latency.

  The article targets routers, planners, and domain specialists whose separate loops may no longer help. This is experience from particular deployments, not a universal claim that every multi-agent system should be collapsed or that subagents have become unnecessary.
