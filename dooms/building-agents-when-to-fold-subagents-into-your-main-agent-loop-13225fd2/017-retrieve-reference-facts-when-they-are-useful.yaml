title: Retrieve reference facts when they are useful
text: |-
  Policies, metric definitions, and product specifications belong in knowledge bases or skill reference files when they are needed only occasionally. Search and lookup tools let the model fetch them in context.

  The article advises against automatically pasting broad reference material into prompts. Distinguish instructions about how to work from facts needed for one step, so neither the system prompt nor every skill becomes a permanent store of unrelated material.
