title: Team ownership can create architectural sprawl
text: |-
  When each product team builds a specialist and a platform team adds an orchestrator, context exchange and ownership become harder. Details disappear through handoffs, agents overlap, and localized evaluations can obscure end-to-end failures.

  Meanwhile, everyone contributes instructions to a growing system prompt. The article calls out the resulting conflicting rules and inconsistent voice, plus the extra latency of nested model loops.
