title: A tool call can preserve the main conversation
text: |-
  When a subagent remains useful, expose it as a tool so the main agent continues handling the user’s conversation. A shared response schema can make outputs easier to check and synthesize.

  Reserve a full conversational handoff for a specialist that actually needs to speak to the user. Calling a subagent as a tool is a migration step, though it still retains a nested model loop and summarized output.
