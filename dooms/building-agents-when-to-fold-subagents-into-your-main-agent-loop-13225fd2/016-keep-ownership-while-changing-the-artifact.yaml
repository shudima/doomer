title: Keep ownership while changing the artifact
text: |-
  Domain teams can own skills containing their procedures, rules, and judgment calls instead of maintaining separate agents. A designated owner should keep each skill distinct, well formed, and accompanied by relevant evaluations.

  The article points to skill-creator for authoring and restructuring, and skill-doctor for inspecting usage and context cost. Skill libraries need pruning and maintenance too; consolidation can otherwise replace agent sprawl with another form of clutter.
