title: Let tools enforce prerequisites and permissions
text: |-
  If an action requires the result of an earlier lookup, the tool can check that prerequisite and return an actionable instruction when it is missing. Per-user access checks belong in the tool too.

  This allows one agent loop to serve users with different permissions without creating a separate agent for every access level. A shared reasoning context does not eliminate the need for explicit authorization boundaries.
