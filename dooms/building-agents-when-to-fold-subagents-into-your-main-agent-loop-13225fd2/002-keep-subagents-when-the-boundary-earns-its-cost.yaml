title: Keep subagents when the boundary earns its cost
text: |-
  The article retains subagents for measurable context degradation, independent parallel work with disposable contexts, or cases where one model struggles with tool selection or conflicting instructions. Verification and separate permission boundaries can also be useful.

  These are functional reasons to split work. Giving every department its own agent merely because it owns a capability can reproduce the organization chart without improving the system’s behavior.
