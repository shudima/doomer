title: Put procedure in skills and hard rules in tools
text: |-
  In the single-loop design, domain ordering and judgment move into skills, while validation, permissions, and other hard constraints stay enforced in tools. Mechanical payload construction and parsing can remain ordinary code.

  The article also allows cheap, almost-always-relevant preprocessing. Simplifying the reasoning architecture does not require making every operation a model decision or trusting the prompt to enforce constraints that code can check.
