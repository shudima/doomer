title: Offload large tool results before they enter
text: |-
  The article describes FilesystemMiddleware writing tool results larger than roughly 20,000 tokens to a file under /large_tool_results/. The model receives a short preview and a path instead of the complete result.

  It can later page through the file to retrieve the relevant rows. This preserves access to a large export without forcing every subsequent model call to carry the full dataset.
