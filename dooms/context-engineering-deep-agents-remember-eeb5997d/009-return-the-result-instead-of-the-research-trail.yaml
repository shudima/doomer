title: Return the result instead of the research trail
text: |-
  Known noisy work can run in a separate agent context. In the article’s example, a market researcher reads a company report and returns three notable developments. The main agent receives those bullets rather than the raw report and tool history.

  The harness can customize that worker’s prompt and tools. Small, bounded assignments may also fit cheaper models and parallel execution, depending on the workflow.
