title: Research creates context the final draft no longer needs
text: |-
  A weekly competitive-analysis agent might read large exports, search articles, take notes, and revise reports for five companies. By formatting time, raw exports and stale drafts still accompany model calls even when they are irrelevant.

  The harness should retain a route back to that evidence while carrying only the material needed now. Keeping everything permanently visible is different from keeping everything recoverable.
