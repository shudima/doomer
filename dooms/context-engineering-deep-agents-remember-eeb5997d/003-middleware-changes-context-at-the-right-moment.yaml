title: Middleware changes context at the right moment
text: |-
  An agent loops through model decisions, tool calls, and results. Middleware plugs into points such as run startup, model invocation, or tool execution to inspect and change what the next step receives.

  Deep Agents implements its context techniques through those hooks. Most are built in, while customization lets applications adjust the behavior instead of having to reconstruct the entire harness around their chosen model.
