title: Keep procedures in a menu until needed
text: |-
  A quarterly-report template wastes context if every research call carries it. Package the procedure as a skill with a short description, instructions, and optional references or scripts.

  SkillsMiddleware scans the headers and advertises names and descriptions. The full instructions enter context when the model reads the relevant skill. This progressive disclosure gives the agent access to many procedures without loading all of them at once.
