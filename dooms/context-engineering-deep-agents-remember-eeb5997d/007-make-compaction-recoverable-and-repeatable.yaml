title: Make compaction recoverable and repeatable
text: |-
  Deep Agents writes summarized messages to a session history file so the agent can recover details later. As the task continues, context grows again and a later summary includes the previous one.

  Summarization therefore cycles rather than solving context growth permanently. The article also suggests adapting the trigger or prompt—for example, summarizing on topic changes—instead of assuming a single token threshold suits every workload.
