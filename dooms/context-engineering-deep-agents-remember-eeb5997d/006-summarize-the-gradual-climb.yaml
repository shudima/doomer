title: Summarize the gradual climb
text: |-
  Offloading limits sudden context spikes, but searches, notes, and conversation still accumulate. Before model calls, SummarizationMiddleware checks usage and, by default, condenses older messages when it crosses 85% of the model’s context window.

  The recent messages stay verbatim. The model sees the summary followed by that recent history, reducing active context while preserving the latest details without paraphrase.
